<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEXA Mining Ultimate</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
min-height:100vh;
}

/* HEADER */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#020617;
box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(45deg,#00f2fe,#4facfe);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

/* MAIN */

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
padding:20px;
margin-bottom:20px;
backdrop-filter:blur(10px);
box-shadow:0 0 20px rgba(0,255,255,0.15);
}

/* BALANCE */

.balance{
font-size:36px;
font-weight:bold;
text-align:center;
}

/* MINE BUTTON */

.mine-btn{
width:200px;
height:200px;
border-radius:50%;
border:none;
background:linear-gradient(45deg,#00f2fe,#4facfe);
font-size:26px;
margin:20px auto;
display:block;
color:white;
cursor:pointer;
box-shadow:0 0 40px rgba(0,255,255,0.6);
transition:0.2s;
}

.mine-btn:hover{
transform:scale(1.08);
}

/* PROGRESS */

.progress{
height:12px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#00f2fe,#4facfe);
}

/* FORMS */

input{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

/* LOGIN */

.auth{
max-width:400px;
margin:80px auto;
}

.leaderboard div{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}

</style>
</head>

<body>

<div id="auth" class="auth card">

<h2>VEXA Mining</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>

</div>

<div id="app" style="display:none">

<header>

<div class="profile">
<div class="avatar" id="avatar">U</div>
<div>
<div id="username"></div>
<div>Level <span id="level">1</span></div>
</div>
</div>

<button onclick="logout()">Logout</button>

</header>

<div class="container">

<div class="card">

<div class="balance" id="coins">0.000</div>

<button class="mine-btn" onclick="mine()">MINE</button>

<div>XP</div>

<div class="progress">
<div class="bar" id="xpbar"></div>
</div>

</div>

<div class="card">

<h3>Daily Reward</h3>

<button onclick="daily()">Claim</button>

</div>

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet">
<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Request</button>

</div>

<div class="card">

<h3>Leaderboard</h3>

<div id="leaderboard"></div>

</div>

</div>

</div>

<script>

const supabaseUrl="https://kdmknilstonmiesjocvy.supabase.co"
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE"

const db=supabase.createClient(supabaseUrl,supabaseKey)

let user=null
let coins=0
let xp=0
let level=1

async function signup(){

const {error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error) alert(error.message)
else alert("Account created")

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error) return alert(error.message)

user=data.user

startApp()

}

async function startApp(){

auth.style.display="none"
app.style.display="block"

avatar.innerText=user.email[0].toUpperCase()
username.innerText=user.email.split("@")[0]

loadUser()
leaderboard()

}

async function loadUser(){

let {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

if(!data){

await db.from("users").insert({
id:user.id
})

coins=0
xp=0
level=1

}else{

coins=Number(data.coins)||0
xp=Number(data.xp)||0
level=Number(data.level)||1

}

updateUI()

}

function updateUI(){

document.getElementById("coins").innerText=coins.toFixed(3)

document.getElementById("level").innerText=level

let percent=(xp%100)

xpbar.style.width=percent+"%"

}

async function mine(){

coins+=0.001
xp+=5

if(xp>=level*100){

level++
alert("Level up!")

}

updateUI()

await db
.from("users")
.update({coins,xp,level})
.eq("id",user.id)

}

async function daily(){

coins+=0.01

updateUI()

await db
.from("users")
.update({coins})
.eq("id",user.id)

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:Number(amount.value),
wallet:wallet.value
})

alert("Withdrawal sent")

}

async function leaderboard(){

const {data}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

leaderboard.innerHTML=""

data.forEach((u,i)=>{

let div=document.createElement("div")

div.innerHTML=`<span>#${i+1}</span><span>${Number(u.coins).toFixed(2)}</span>`

leaderboard.appendChild(div)

})

}

async function logout(){

await db.auth.signOut()

location.reload()

}

</script>

</body>
</html>
