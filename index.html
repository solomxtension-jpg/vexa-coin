<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>VEX Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* ---------- GLOBAL ---------- */

body{
margin:0;
font-family:Arial;
background:#0b0f19;
color:white;
}

/* ---------- HEADER ---------- */

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#121826;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:20px;
font-weight:bold;
color:#22d3ee;
}

.user{
display:flex;
gap:10px;
align-items:center;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(45deg,#22d3ee,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

/* ---------- LAYOUT ---------- */

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

/* ---------- CARDS ---------- */

.card{
background:#121826;
border-radius:12px;
padding:20px;
border:1px solid #1f2937;
}

/* ---------- BALANCE ---------- */

.balance{
font-size:36px;
font-weight:bold;
}

/* ---------- BUTTON ---------- */

button{
background:#22d3ee;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* ---------- INPUT ---------- */

input{
width:100%;
padding:10px;
border-radius:8px;
border:none;
margin-top:10px;
}

/* ---------- TIMER ---------- */

.timer{
font-size:18px;
color:#22d3ee;
margin-top:10px;
}

/* ---------- LOGIN ---------- */

.auth{
max-width:400px;
margin:100px auto;
}

.leaderboard div{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px solid #1f2937;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="auth" class="auth card">

<h2>VEX Login</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button onclick="signup()">Signup</button>

</div>

<!-- DASHBOARD -->

<div id="app" style="display:none">

<header>

<div class="logo">VEX</div>

<div class="user">

<div class="avatar" id="avatar"></div>

<div id="username"></div>

<button onclick="logout()">Logout</button>

</div>

</header>

<div class="container">

<div class="grid">

<div class="card">

<h3>Balance</h3>

<div class="balance" id="coins">0</div>

<p>VEXA Coin</p>

</div>

<div class="card">

<h3>Mining</h3>

<button id="mineBtn" onclick="mine()">Start Mining</button>

<div class="timer" id="timer"></div>

</div>

<div class="card">

<h3>Level</h3>

<p>Level <span id="level">1</span></p>

<p>XP <span id="xp">0</span></p>

</div>

<div class="card">

<h3>Referral</h3>

<input id="refcode" readonly>

</div>

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet">

<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Request</button>

</div>

<div class="card">

<h3>Leaderboard</h3>

<div id="leaderboard"></div>

</div>

</div>

</div>

</div>

<script>

const supabaseUrl="https://kdmknilstonmiesjocvy.supabase.co"
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE"

const db=supabase.createClient(supabaseUrl,supabaseKey)

let user
let coins=0
let xp=0
let level=1
let lastMine=null

async function signup(){

const {error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error) alert(error.message)
else alert("Account created")

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error) return alert(error.message)

user=data.user

start()

}

async function start(){

auth.style.display="none"
app.style.display="block"

avatar.innerText=user.email[0].toUpperCase()
username.innerText=user.email.split("@")[0]

loadUser()

leaderboard()

setInterval(updateTimer,1000)

}

async function loadUser(){

let {data}=await db.from("users").select("*").eq("id",user.id).single()

if(!data){

let code=Math.random().toString(36).substring(2,8)

await db.from("users").insert({
id:user.id,
refcode:code
})

refcode.value=code

}else{

coins=Number(data.coins)||0
xp=Number(data.xp)||0
level=Number(data.level)||1
lastMine=data.last_mine

refcode.value=data.refcode

}

updateUI()

}

function updateUI(){

coinsEl.innerText=coins.toFixed(3)

level.innerText=level

xp.innerText=xp

}

async function mine(){

let now=new Date()

if(lastMine){

let diff=(now-new Date(lastMine))/1000

if(diff<86400){

alert("Mining already started")

return

}

}

coins+=1

xp+=10

lastMine=new Date()

await db.from("users").update({
coins,
xp,
level,
last_mine:lastMine
}).eq("id",user.id)

updateUI()

}

function updateTimer(){

if(!lastMine) return

let now=new Date()

let diff=86400-((now-new Date(lastMine))/1000)

if(diff<0){

timer.innerText="Ready to mine"

return

}

let h=Math.floor(diff/3600)
let m=Math.floor((diff%3600)/60)
let s=Math.floor(diff%60)

timer.innerText=h+"h "+m+"m "+s+"s"

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
wallet:wallet.value,
amount:Number(amount.value)
})

alert("Withdrawal sent")

}

async function leaderboard(){

const {data}=await db.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

leaderboard.innerHTML=""

data.forEach((u,i)=>{

let div=document.createElement("div")

div.innerHTML="#"+(i+1)+" "+Number(u.coins).toFixed(2)

leaderboard.appendChild(div)

})

}

async function logout(){

await db.auth.signOut()

location.reload()

}

</script>

</body>
</html>
