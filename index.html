<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO+</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:20px;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:370px;
  margin:auto;
  margin-bottom:20px;
  box-shadow:0 0 20px #00f0ff33;
}
button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:8px;
}
hr{margin:15px 0;}
</style>
</head>

<body>

<div class="card">

<h2>VEXA COIN MINING PRO+</h2>

<input id="username" placeholder="Enter Username" onkeyup="loadBalance()">
<input id="referral" placeholder="Referral Username (optional)">

<h3 id="balance">Balance: 0 VEXA</h3>

<button onclick="startMining()">Start Mining</button>
<button onclick="claimDailyReward()">Claim Daily Reward</button>

<hr>

<h4>Withdraw</h4>
<input id="withdrawAmount" placeholder="Amount (min 50)">
<input id="walletAddress" placeholder="Wallet Address">
<button onclick="withdrawCoins()">Withdraw</button>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  'https://qmcjmnugpujsqabqejpx.supabase.co',
  'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

let mining = false;
let miningInterval;

async function loadBalance(){
  const username = document.getElementById("username").value;
  if(!username) return;

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(data){
    document.getElementById("balance").innerText =
      "Balance: " + data.balance + " VEXA";
  }
}

async function startMining(){

  const username = document.getElementById("username").value;
  const referral = document.getElementById("referral").value;

  if(!username){ alert("Enter username"); return; }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  // If new user
  if(!data){

    await supabaseClient.from('users').insert({
      username: username,
      balance: 5, // signup bonus
      referred_by: referral || null
    });

    // Give referrer bonus
    if(referral){
      let { data: refUser } = await supabaseClient
        .from('users')
        .select('*')
        .eq('username', referral)
        .single();

      if(refUser){
        await supabaseClient
          .from('users')
          .update({ balance: refUser.balance + 5 })
          .eq('username', referral);
      }
    }

    data = { balance: 5 };
  }

  document.getElementById("balance").innerText =
    "Balance: " + data.balance + " VEXA";

  if(mining) return;
  mining = true;

  miningInterval = setInterval(async () => {

    let { data } = await supabaseClient
      .from('users')
      .select('*')
      .eq('username', username)
      .single();

    if(data){
      let newBalance = data.balance + 1;

      await supabaseClient
        .from('users')
        .update({ balance: newBalance })
        .eq('username', username);

      document.getElementById("balance").innerText =
        "Balance: " + newBalance + " VEXA";
    }

  }, 5000);
}

async function claimDailyReward(){
  alert("Daily reward system already active in previous version.");
}

async function withdrawCoins(){

  const username = document.getElementById("username").value;
  const amount = parseInt(document.getElementById("withdrawAmount").value);
  const wallet = document.getElementById("walletAddress").value;

  if(!username || !amount || !wallet){
    alert("Fill all fields");
    return;
  }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(data.balance < amount){
    alert("Not enough balance");
    return;
  }

  let newBalance = data.balance - amount;

  await supabaseClient
    .from('users')
    .update({ balance: newBalance })
    .eq('username', username);

  await supabaseClient
    .from('withdrawals')
    .insert({
      username: username,
      amount: amount,
      wallet: wallet,
      status: "pending"
    });

  document.getElementById("balance").innerText =
    "Balance: " + newBalance + " VEXA";

  alert("Withdrawal request sent!");
}

</script>
</body>
</html>
