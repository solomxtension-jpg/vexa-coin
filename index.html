<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXA Mining App</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
    #coins { font-size: 2em; margin: 20px 0; }
    button { padding: 10px 20px; font-size: 1em; cursor: pointer; }
    #status { margin-top: 20px; color: green; }
  </style>
</head>
<body>

  <h1>VEXA Mining App</h1>
  <div>Your Coins: <span id="coins">0</span></div>
  <button id="mineBtn">Mine Coins</button>
  <div id="status"></div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // --- 1. Supabase Setup ---
    const supabaseUrl = "YOUR_SUPABASE_URL";
    const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
    const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

    let userId = null;
    let coinElement = document.getElementById("coins");
    let statusElement = document.getElementById("status");
    let mineBtn = document.getElementById("mineBtn");

    // --- 2. Auth Check ---
    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // If no session, sign in anonymously
        const { data, error } = await supabase.auth.signInWithOAuth({ provider: 'github' });
        console.log(data, error);
        return;
      }
      
      userId = session.user.id;
      await loadCoins();
    }

    // --- 3. Load Coins ---
    async function loadCoins() {
      const { data, error } = await supabase
        .from('users')
        .select('coins')
        .eq('id', userId)
        .single();

      if (error) {
        console.error(error);
        statusElement.textContent = "Error loading coins";
        return;
      }

      coinElement.textContent = data.coins || 0;
    }

    // --- 4. Mine Coins ---
    mineBtn.addEventListener("click", async () => {
      statusElement.textContent = "Mining...";
      mineBtn.disabled = true;

      // Simulate mining (add random 1-5 coins)
      const minedCoins = Math.floor(Math.random() * 5) + 1;

      // Update coins in Supabase
      const { data, error } = await supabase
        .from('users')
        .update({ coins: supabase.raw('coins + ?', [minedCoins]) })
        .eq('id', userId)
        .select()
        .single();

      if (error) {
        console.error(error);
        statusElement.textContent = "Error mining coins";
        mineBtn.disabled = false;
        return;
      }

      coinElement.textContent = data.coins;
      statusElement.textContent = `You mined ${minedCoins} coins!`;
      mineBtn.disabled = false;
    });

    // --- 5. Initialize ---
    window.addEventListener('load', init);
  </script>
</body>
</html>
