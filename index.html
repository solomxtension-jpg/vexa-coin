<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEX Mining Network</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0b0f1a;
color:white;
transition:.3s;
}

.light{
background:#f3f4f6;
color:#111;
}

header{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#121826;
border-bottom:1px solid #1f2937;
}

.logo{
font-size:20px;
font-weight:700;
color:#22c55e;
}

.menuBtn{
font-size:22px;
cursor:pointer;
}

.sidebar{
position:fixed;
right:-270px;
top:0;
height:100%;
width:260px;
background:#121826;
padding:20px;
transition:.4s;
z-index:999;
}

.sidebar.active{
right:0;
}

.menuItem{
padding:12px;
border-bottom:1px solid #1f2937;
cursor:pointer;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.balance{
font-size:42px;
font-weight:700;
margin-top:15px;
}

.buttons{
display:flex;
gap:10px;
margin-top:10px;
}

button{
padding:10px 16px;
border:none;
border-radius:8px;
cursor:pointer;
background:#22c55e;
color:white;
font-weight:600;
}

.card{
background:#121826;
padding:20px;
border-radius:10px;
margin-top:20px;
}

.ad{
height:90px;
background:#1f2937;
display:flex;
align-items:center;
justify-content:center;
border-radius:8px;
margin-top:20px;
}

.crypto{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.crypto div{
background:#1f2937;
padding:10px;
border-radius:6px;
}

.circleBox{
display:flex;
justify-content:center;
margin-top:25px;
}

.circleText{
position:absolute;
margin-top:80px;
font-size:18px;
}

.table{
width:100%;
margin-top:10px;
}

.table td{
padding:8px;
border-bottom:1px solid #1f2937;
}

input{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:6px;
background:#1f2937;
color:white;
}

</style>

</head>

<body>

<header>

<div class="logo">VEX</div>

<div class="menuBtn" onclick="toggleMenu()">☰</div>

</header>


<div class="sidebar" id="menu">

<div class="menuItem" onclick="showPage('home')">Home</div>
<div class="menuItem" onclick="showPage('leaderboard')">Leaderboard</div>
<div class="menuItem" onclick="showPage('referral')">Referral</div>
<div class="menuItem" onclick="showPage('upgrades')">Upgrades</div>
<div class="menuItem" onclick="showPage('withdraw')">Withdraw</div>
<div class="menuItem" onclick="showPage('chart')">Charts</div>
<div class="menuItem" onclick="showPage('settings')">Settings</div>
<div class="menuItem" onclick="showPage('admin')">Admin</div>

</div>


<div class="container">

<!-- HOME -->

<div id="home">

<h2>Balance</h2>

<div class="balance" id="balance">0.0000</div>

<div class="buttons">

<button onclick="boost()">Boost</button>
<button onclick="showPage('withdraw')">Withdraw</button>

</div>

<div class="circleBox">

<svg width="200" height="200">

<circle cx="100" cy="100" r="90" stroke="#1f2937" stroke-width="10" fill="none"/>

<circle id="mineCircle"

cx="100"
cy="100"
r="90"
stroke="#22c55e"
stroke-width="10"
fill="none"
stroke-dasharray="565"
stroke-dashoffset="565"/>

</svg>

<div class="circleText" id="timer">24h</div>

</div>

<div class="ad">Ad Space</div>

<div class="card">

<h3>Crypto Prices</h3>

<div class="crypto">

<div>BTC $<span id="btc"></span></div>
<div>ETH $<span id="eth"></span></div>
<div>BNB $<span id="bnb"></span></div>
<div>SOL $<span id="sol"></span></div>

</div>

</div>

</div>


<!-- LEADERBOARD -->

<div id="leaderboard" style="display:none">

<div class="card">

<h3>Top Miners</h3>

<table class="table" id="leaderTable"></table>

</div>

</div>


<!-- REFERRAL -->

<div id="referral" style="display:none">

<div class="card">

<h3>Your Code</h3>

<p id="refCode"></p>

<p id="refLink"></p>

<button onclick="copyRef()">Copy Link</button>

</div>

<div class="card">

<h3>Referred Users</h3>

<table class="table" id="refUsers"></table>

</div>

<div class="card">

<h3>Referral Tree</h3>

<div id="refTree"></div>

</div>

</div>


<!-- UPGRADES -->

<div id="upgrades" style="display:none">

<div class="card">

<h3>Upgrades</h3>

<button onclick="upgrade('speed')">Speed Miner</button>

<button onclick="upgrade('boost')">Power Boost</button>

</div>

</div>


<!-- WITHDRAW -->

<div id="withdraw" style="display:none">

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet">

<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Request</button>

</div>

</div>


<!-- CHART -->

<div id="chart" style="display:none">

<div class="card">

<h3>Balance Chart</h3>

<canvas id="balanceChart"></canvas>

</div>

</div>


<!-- SETTINGS -->

<div id="settings" style="display:none">

<div class="card">

<h3>Theme</h3>

<button onclick="toggleTheme()">Light / Dark</button>

</div>

</div>


<!-- ADMIN -->

<div id="admin" style="display:none">

<div class="card">

<h3>Admin Panel</h3>

<button onclick="loadUsers()">Load Users</button>

<table class="table" id="adminUsers"></table>

</div>

</div>

</div>


<script>

const SUPABASE_URL="YOUR_SUPABASE_URL"
const SUPABASE_KEY="YOUR_ANON_KEY"

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let balance=0

function toggleMenu(){
menu.classList.toggle("active")
}

function showPage(id){

document.querySelectorAll(".container > div").forEach(x=>x.style.display="none")

document.getElementById(id).style.display="block"

menu.classList.remove("active")

}

function toggleTheme(){
document.body.classList.toggle("light")
}


function animateBalance(){

setInterval(()=>{

balance+=0.0001

document.getElementById("balance").innerText=balance.toFixed(4)

},2000)

}

animateBalance()



/* mining progress */

let p=0

setInterval(()=>{

p+=0.05

if(p>100)p=0

let offset=565-(565*p/100)

mineCircle.style.strokeDashoffset=offset

},60000)



/* crypto prices */

async function crypto(){

let r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin,solana&vs_currencies=usd")

let d=await r.json()

btc.innerText=d.bitcoin.usd
eth.innerText=d.ethereum.usd
bnb.innerText=d.binancecoin.usd
sol.innerText=d.solana.usd

}

crypto()



/* leaderboard */

async function leaderboard(){

let {data}=await db.from("users").select("email,coins").order("coins",{ascending:false}).limit(10)

leaderTable.innerHTML=""

data.forEach(u=>{

leaderTable.innerHTML+=`<tr><td>${u.email}</td><td>${u.coins}</td></tr>`

})

}

leaderboard()



/* referral */

function copyRef(){

navigator.clipboard.writeText(refLink.innerText)

alert("Copied")

}



/* withdrawals */

async function withdraw(){

await db.from("withdrawals").insert({

wallet:wallet.value,
amount:amount.value

})

alert("Request sent")

}



/* upgrades */

function upgrade(type){

alert(type+" upgraded")

}



/* admin */

async function loadUsers(){

let {data}=await db.from("users").select("email,coins")

adminUsers.innerHTML=""

data.forEach(u=>{

adminUsers.innerHTML+=`<tr><td>${u.email}</td><td>${u.coins}</td></tr>`

})

}



/* balance chart */

new Chart(

document.getElementById("balanceChart"),

{
type:"line",

data:{
labels:["1","2","3","4","5","6"],
datasets:[{
label:"Balance",
data:[0,2,3,5,7,10]
}]
}

}

)

</script>

</body>
</html>
