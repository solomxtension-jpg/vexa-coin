<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>VEXA Mining</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body style="font-family:Arial;text-align:center;margin-top:40px;">

<h1>VEXA Mining ⛏</h1>

<!-- AUTH -->
<div id="auth-section">
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="register()">Register</button>
  <button onclick="login()">Login</button>

  <p id="auth-message"></p>
</div>

<!-- APP -->
<div id="app-section" style="display:none;">
  <h2>Coins: <span id="coins">0</span></h2>
  <h3>Mining Power: <span id="power">1</span></h3>
  <h3>Auto Power: <span id="autoPower">0</span></h3>

  <button onclick="mine()">Tap & Mine</button>
  <br><br>

  <button onclick="upgradePower()">Upgrade Tap (Cost: 50)</button>
  <br><br>

  <button onclick="upgradeAuto()">Upgrade Auto (Cost: 100)</button>
  <br><br>

  <button onclick="logout()">Logout</button>
</div>

<script>

const supabaseClient = supabase.createClient(
  "https://qmcjmnugpujsqabqejpx.supabase.co",
  "YOUR_ANON_KEY_HERE"
);

let currentUser = null;
let coins = 0;
let power = 1;
let autoPower = 0;
let autoInterval = null;

/* ================= AUTH ================= */

async function register() {
  const email = emailInput();
  const password = passwordInput();

  const { data, error } = await supabaseClient.auth.signUp({ email, password });

  if (error) {
    message(error.message);
    return;
  }

  message("Registered! Now login.");
}

async function login() {
  const email = emailInput();
  const password = passwordInput();

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    message(error.message);
    return;
  }

  currentUser = data.user;

  await loadUserData();
  startApp();
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

/* ================= GAME ================= */

function mine() {
  coins += power;
  updateUI();
  saveUserData();
}

function upgradePower() {
  if (coins >= 50) {
    coins -= 50;
    power += 1;
    updateUI();
    saveUserData();
  }
}

function upgradeAuto() {
  if (coins >= 100) {
    coins -= 100;
    autoPower += 1;
    startAutoMining();
    updateUI();
    saveUserData();
  }
}

function startAutoMining() {
  if (autoInterval) clearInterval(autoInterval);

  autoInterval = setInterval(() => {
    coins += autoPower;
    updateUI();
    saveUserData();
  }, 1000);
}

/* ================= DATABASE ================= */

async function loadUserData() {

  const { data, error } = await supabaseClient
    .from("users")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (!data) {
    await supabaseClient.from("users").insert({
      id: currentUser.id,
      coins: 0,
      power: 1,
      auto_power: 0
    });

    coins = 0;
    power = 1;
    autoPower = 0;
  } else {
    coins = data.coins;
    power = data.power;
    autoPower = data.auto_power;
  }

  updateUI();
  startAutoMining();
}

async function saveUserData() {
  await supabaseClient
    .from("users")
    .update({
      coins: coins,
      power: power,
      auto_power: autoPower
    })
    .eq("id", currentUser.id);
}

/* ================= UI ================= */

function startApp() {
  document.getElementById("auth-section").style.display = "none";
  document.getElementById("app-section").style.display = "block";
}

function updateUI() {
  document.getElementById("coins").innerText = coins;
  document.getElementById("power").innerText = power;
  document.getElementById("autoPower").innerText = autoPower;
}

function emailInput() {
  return document.getElementById("email").value;
}

function passwordInput() {
  return document.getElementById("password").value;
}

function message(text) {
  document.getElementById("auth-message").innerText = text;
}

</script>

</body>
</html>
