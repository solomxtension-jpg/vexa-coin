<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{
  background: linear-gradient(135deg,#0b0f1a,#1c1f2a);
  color:white;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  margin:0;
}
.card{
  background:#111827;
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:500px;
  box-shadow: 0 0 40px rgba(0,229,255,0.3);
  position:relative;
  overflow:hidden;
}
input,button{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  font-size:16px;
}
button{
  background:#22d3ee;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition: transform 0.1s;
}
button:hover{ transform: scale(1.03); }
button.secondary{
  background:#1f2937;
  color:white;
}
.hidden{ display:none; }
#progressContainer{
  width:100%;
  height:20px;
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}
#progressBar{
  height:100%;
  width:0%;
  background:#00e5ff;
  transition: width 0.2s linear;
}
.floating-coin{
  position:absolute;
  font-size:22px;
  animation:floatUp 1s forwards;
}
@keyframes floatUp{
  from{opacity:1; transform:translateY(0);}
  to{opacity:0; transform:translateY(-60px);}
}
h2{
  text-align:center;
  color:#00e5ff;
  margin-bottom:15px;
}
.upgrade-buttons button{
  margin-bottom:8px;
}
</style>
</head>
<body>

<div class="card">

  <!-- AUTH -->
  <div id="authDiv">
    <h2>VEXA Mining PRO v4</h2>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
    <p id="authMsg" style="color:#f87171;"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="appDiv" class="hidden">
    <h2>Dashboard</h2>
    <p>Balance: <b><span id="balance">0.000000</span></b> VEXA</p>
    <p>Mining Rate: <b><span id="rate">1</span></b>/tick</p>
    <button id="startBtn">⛏ Start Mining</button>
    <button id="stopBtn" class="secondary">Stop Mining</button>
    <div id="progressContainer"><div id="progressBar"></div></div>
    <h3>Upgrades</h3>
    <div class="upgrade-buttons">
      <button onclick="buyUpgrade('autoPower',10)">Auto Power (+1) - 10</button>
      <button onclick="buyUpgrade('multiplier',25)">Multiplier x2 - 25</button>
      <button onclick="buyUpgrade('speed',50)">Faster Mining - 50</button>
    </div>
    <button id="logoutBtn" class="secondary">Logout</button>
    <p id="msg" style="color:#f87171;"></p>
  </div>

</div>

<script>
/* ================== SUPABASE CONFIG ================== */
const SUPABASE_URL = "https://kdmknilstonmiesjocvy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================== STATE ================== */
let currentUser = null;
let coins = 0;
let autoPower = 1;
let multiplier = 1;
let miningSpeed = 60000; // 60 sec main mining
let miningInterval = null;
let progressInterval = null;

/* ================== ELEMENTS ================== */
const authDiv = document.getElementById("authDiv");
const appDiv = document.getElementById("appDiv");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const authMsg = document.getElementById("authMsg");
const balanceSpan = document.getElementById("balance");
const rateSpan = document.getElementById("rate");
const progressBar = document.getElementById("progressBar");
const msg = document.getElementById("msg");

/* ================== AUTH FUNCTIONS ================== */
document.getElementById("signupBtn").onclick = async function() {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if(!email || !password){ authMsg.innerText="Enter email and password"; return; }
  const { error } = await supabase.auth.signUp({ email, password });
  authMsg.innerText = error ? error.message : "Signup successful. Login now.";
}

document.getElementById("loginBtn").onclick = async function() {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if(!email || !password){ authMsg.innerText="Enter email and password"; return; }
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authMsg.innerText = error.message; return; }
  currentUser = data.user;
  authDiv.classList.add("hidden");
  appDiv.classList.remove("hidden");
  await loadUser();
}

document.getElementById("logoutBtn").onclick = async function() {
  await supabase.auth.signOut();
  location.reload();
}

/* ================== LOAD USER ================== */
async function loadUser(){
  const { data, error } = await supabase.from("users").select("*").eq("id", currentUser.id).single();
  if(!data){
    await supabase.from("users").insert({id:currentUser.id, coins:0, auto_power:1, multiplier:1, speed:miningSpeed});
    coins=0; autoPower=1; multiplier=1;
  } else {
    coins = data.coins || 0;
    autoPower = data.auto_power || 1;
    multiplier = data.multiplier || 1;
    miningSpeed = data.speed || 60000;
  }
  updateUI();
}

/* ================== MINING ================== */
document.getElementById("startBtn").onclick = startMining;
document.getElementById("stopBtn").onclick = stopMining;

function startMining(){
  if(miningInterval) return;

  let progress = 0;
  progressInterval = setInterval(()=>{
    progress += 2;
    if(progress>100) progress=0;
    progressBar.style.width = progress + "%";
    showCoin();
  }, 1000);

  miningInterval = setInterval(async ()=>{
    const miningAmount = 0.001 * autoPower * multiplier;
    coins = Number(coins) + miningAmount;
    await supabase.from("users").update({ coins }).eq("id", currentUser.id);
    updateUI();
  }, miningSpeed);
}

function stopMining(){
  clearInterval(miningInterval);
  clearInterval(progressInterval);
  miningInterval = null;
  progressBar.style.width="0%";
}

/* ================== UPGRADES ================== */
async function buyUpgrade(type,cost){
  if(coins<cost){ alert("Not enough coins"); return; }
  coins -= cost;
  if(type==="autoPower") autoPower+=1;
  if(type==="multiplier") multiplier*=2;
  if(type==="speed") miningSpeed = Math.max(1000, miningSpeed-500);
  await supabase.from("users").update({coins, auto_power:autoPower, multiplier, speed:miningSpeed}).eq("id",currentUser.id);
  stopMining();
  startMining();
  updateUI();
}

/* ================== UI ================== */
function updateUI(){
  balanceSpan.innerText = Number(coins).toFixed(6);
  rateSpan.innerText = (autoPower*multiplier).toFixed(2);
}
function showCoin(){
  const coin = document.createElement("div");
  coin.className="floating-coin";
  coin.innerText="🪙";
  document.querySelector(".card").appendChild(coin);
  coin.style.left = Math.random()*80+"%";
  setTimeout(()=>coin.remove(),1000);
}

/* ================== AUTO LOGIN ================== */
(async ()=>{
  const { data:{session} } = await supabase.auth.getSession();
  if(session){
    currentUser = session.user;
    authDiv.classList.add("hidden");
    appDiv.classList.remove("hidden");
    await loadUser();
  }
})();
</script>

</body>
</html>
