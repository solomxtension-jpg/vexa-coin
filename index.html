<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<link rel="manifest" href="manifest.json">

<style>
body{
  background:#0b0f1a;
  color:#ffffff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:16px;
  width:350px;
  box-shadow:0 0 25px rgba(0,229,255,.2);
  text-align:center;
}
input{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
button{
  width:95%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#1c2747;
  color:#fff;
}
hr{margin:15px 0; border-color:#00e5ff33;}
#progressContainer{
  width:90%;
  height:18px;
  background:#1c2747;
  border-radius:10px;
  margin:10px auto;
  overflow:hidden;
}
#progressBar{
  width:0%;
  height:100%;
  background:#00e5ff;
  transition:width 0.2s linear;
}
.floating-coin{
  position:absolute;
  font-size:20px;
  animation:floatUp 1s linear forwards;
}
@keyframes floatUp{
  from{opacity:1; transform:translateY(0);}
  to{opacity:0; transform:translateY(-50px);}
}
</style>
</head>

<body>

<div class="card">
<h2>VEXA Mining PRO</h2>

<div id="authBox">
<input placeholder="Email (demo)">
<input type="password" placeholder="Password (demo)">
<button onclick="login()">Login</button>
</div>

<div id="appBox" style="display:none;">
<h3 id="balance">Balance: 0 VEXA</h3>
<h4 id="level">Level: 1</h4>
<h4 id="rate">Mining rate: 1 VEXA / 5s</h4>
<h4 id="today">Mined today: 0 VEXA</h4>

<button onclick="startMining()">Start Mining</button>
<button onclick="stopMining()" class="secondary">Stop Mining</button>
<button onclick="upgrade()">Upgrade Miner (10 VEXA)</button>

<div id="progressContainer">
  <div id="progressBar"></div>
</div>

<hr>

<button onclick="logout()">Logout</button>
</div>
</div>

<script>
/* ===== TEMPORARY FRONTEND MODE ===== */

let balance = 0;
let level = 1;
let coinsToday = 0;
let miningInterval = null;
let progressInterval = null;

const balanceText = document.getElementById("balance");
const levelText = document.getElementById("level");
const rateText = document.getElementById("rate");
const todayText = document.getElementById("today");
const progressBar = document.getElementById("progressBar");

/* LOGIN (fake for now) */
function login(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("appBox").style.display="block";
  updateUI();
}

/* LOGOUT */
function logout(){
  location.reload();
}

/* UPDATE UI */
function updateUI(){
  balanceText.innerText = "Balance: " + balance + " VEXA";
  levelText.innerText = "Level: " + level;
  rateText.innerText = "Mining rate: " + level + " VEXA / 5s";
  todayText.innerText = "Mined today: " + coinsToday + " VEXA";
}

/* START MINING */
function startMining(){
  if(miningInterval) return;

  let progress = 0;
  progressInterval = setInterval(()=>{
    progress += 2;
    if(progress >= 100) progress = 0;
    progressBar.style.width = progress + "%";
  },100);

  miningInterval = setInterval(()=>{
    balance += level;
    coinsToday += level;
    updateUI();
    spawnCoin();
  },5000);

  alert("Mining started");
}

/* STOP MINING */
function stopMining(){
  clearInterval(miningInterval);
  clearInterval(progressInterval);
  miningInterval = null;
  progressInterval = null;
  progressBar.style.width = "0%";
}

/* UPGRADE */
function upgrade(){
  if(balance < 10){
    alert("You need 10 VEXA to upgrade");
    return;
  }
  balance -= 10;
  level += 1;
  updateUI();
}

/* FLOATING COIN */
function spawnCoin(){
  const coin = document.createElement("div");
  coin.className = "floating-coin";
  coin.innerText = "🪙";
  const rect = progressBar.getBoundingClientRect();
  coin.style.left = rect.left + Math.random()*rect.width + "px";
  coin.style.top = rect.top - 20 + "px";
  document.body.appendChild(coin);
  setTimeout(()=>coin.remove(),1000);
}
</script>

</body>
</html>
