<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Auto Mining PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== BODY ===== */
body {
  font-family: 'Arial', sans-serif;
  background: #0b0f1a;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

/* ===== CARD ===== */
.card {
  background: #111827;
  padding: 30px;
  border-radius: 15px;
  width: 350px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,229,255,0.25);
  position: relative;
}

/* ===== HEADINGS ===== */
h1 {
  font-size: 26px;
  margin-bottom: 20px;
  color: #00e5ff;
}

/* ===== BUTTONS ===== */
button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}
button:hover {
  transform: translateY(-2px);
}
.upgrade {
  background: #22d3ee;
  color: black;
}
.logout {
  background: #1c2747;
  color: white;
}

/* ===== INPUTS ===== */
input {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: none;
}

/* ===== FLOATING COINS ===== */
.floating-coin {
  position: absolute;
  font-size: 22px;
  animation: floatUp 1s forwards;
  pointer-events: none;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-25px) rotate(180deg); }
  100% { opacity: 0; transform: translateY(-50px) rotate(360deg); }
}

/* ===== AUTH MESSAGE ===== */
#auth-message {
  color: #22d3ee;
  font-weight: bold;
  margin-top: 5px;
}
</style>
</head>
<body>

<div class="card">

  <!-- AUTH -->
  <div id="auth-section">
    <h1>VEXA Auto Mining</h1>
    <input type="email" id="email" placeholder="Email"><br>
    <input type="password" id="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>
    <button onclick="login()">Login</button>
    <p id="auth-message"></p>
  </div>

  <!-- APP -->
  <div id="app-section" style="display:none;">
    <h1>VEXA Auto Mining</h1>
    <h2>Coins: <span id="coins">0</span></h2>
    <h3>Auto Power: <span id="autoPower">0</span></h3>
    <button class="upgrade" onclick="upgradeAuto()">Upgrade Auto Mining (100 coins)</button>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

</div>

<script>
// ================= SUPABASE CONNECTION =================
const supabaseClient = supabase.createClient(
  "https://kdmknilstonmiesjocvy.supabase.co",
  "sb_publishable_wrnwdrTIgGn7_q_RgYx0fw_5kbqUUJ1"
);

let currentUser = null;
let coins = 0;
let autoPower = 0;
let autoInterval = null;

// ================= AUTH =================
async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) { message(error.message); return; }
  message("Registered! Now login.");
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { message(error.message); return; }
  currentUser = data.user;
  await loadUserData();
  startApp();
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

// ================= AUTO MINING =================
function startAutoMining() {
  if (autoInterval) clearInterval(autoInterval);
  if (autoPower > 0) {
    autoInterval = setInterval(() => {
      coins += autoPower;
      updateUI();
      showFloatingCoin();
      saveUserData();
    }, 1000);
  }
}

// ================= UPGRADE =================
function upgradeAuto() {
  if (coins >= 100) {
    coins -= 100;
    autoPower += 1;
    updateUI();
    saveUserData();
    startAutoMining();
  }
}

// ================= DATABASE =================
async function loadUserData() {
  const { data, error } = await supabaseClient
    .from("users")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (!data) {
    await supabaseClient.from("users").insert({
      id: currentUser.id,
      coins: 0,
      auto_power: 0
    });
    coins = 0; autoPower = 0;
  } else {
    coins = data.coins; autoPower = data.auto_power;
  }
  updateUI();
  startAutoMining();
}

async function saveUserData() {
  await supabaseClient
    .from("users")
    .update({ coins: coins, auto_power: autoPower })
    .eq("id", currentUser.id);
}

// ================= UI =================
function startApp() {
  document.getElementById("auth-section").style.display = "none";
  document.getElementById("app-section").style.display = "block";
}

function updateUI() {
  document.getElementById("coins").innerText = coins;
  document.getElementById("autoPower").innerText = autoPower;
}

// ================= MESSAGE =================
function message(text) {
  document.getElementById("auth-message").innerText = text;
}

// ================= FLOATING COIN ANIMATION =================
function showFloatingCoin() {
  const coin = document.createElement("div");
  coin.className = "floating-coin";
  coin.innerText = "🪙";
  document.querySelector(".card").appendChild(coin);
  coin.style.left = Math.random() * 80 + "%";
  setTimeout(() => coin.remove(), 1000);
}
</script>

</body>
</html>
