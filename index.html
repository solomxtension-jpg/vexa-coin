<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEX Mining Network</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
<div class="logo">VEX</div>
<div class="menuBtn" onclick="toggleMenu()">☰</div>
</header>

<div class="sidebar" id="menu">
<div onclick="showPage('home')" class="menuItem">Home</div>
<div onclick="showPage('leaderboard')" class="menuItem">Leaderboard</div>
<div onclick="showPage('referral')" class="menuItem">Referral</div>
<div onclick="showPage('withdraw')" class="menuItem">Withdraw</div>
<div onclick="showPage('chart')" class="menuItem">Charts</div>
<div onclick="showPage('settings')" class="menuItem">Settings</div>
<div onclick="showPage('admin')" class="menuItem">Admin</div>
</div>

<div class="container">

<!-- HOME -->
<div id="home">

<h2>Balance</h2>
<div class="balance" id="balance">0.0000</div>

<div class="buttons">
<button onclick="startMining()">Start Mining</button>
<button onclick="showPage('withdraw')">Withdraw</button>
</div>

<div class="circleBox">

<svg width="200" height="200">
<circle cx="100" cy="100" r="90" stroke="#1f2937" stroke-width="10" fill="none"/>
<circle id="mineCircle"
cx="100"
cy="100"
r="90"
stroke="#22c55e"
stroke-width="10"
fill="none"
stroke-dasharray="565"
stroke-dashoffset="565"/>
</svg>

<div class="circleText" id="timer">24h</div>

</div>

<div class="ad">Ad Space</div>

<div class="card">
<h3>Crypto Prices</h3>

<div class="crypto">
<div>BTC $<span id="btc"></span></div>
<div>ETH $<span id="eth"></span></div>
<div>BNB $<span id="bnb"></span></div>
<div>SOL $<span id="sol"></span></div>
</div>

</div>

</div>


<!-- LEADERBOARD -->

<div id="leaderboard" style="display:none">

<div class="card">

<h3>Top Miners</h3>

<table class="table" id="leaderTable"></table>

</div>

</div>


<!-- REFERRAL -->

<div id="referral" style="display:none">

<div class="card">

<h3>Your Referral Code</h3>

<p id="refCode"></p>

<button onclick="copyRef()">Copy</button>

</div>

<div class="card">

<h3>Referred Users</h3>

<table class="table" id="refUsers"></table>

</div>

</div>


<!-- WITHDRAW -->

<div id="withdraw" style="display:none">

<div class="card">

<input id="wallet" placeholder="Wallet Address">

<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Withdraw</button>

</div>

</div>


<!-- CHART -->

<div id="chart" style="display:none">

<div class="card">

<canvas id="balanceChart"></canvas>

</div>

</div>


<!-- SETTINGS -->

<div id="settings" style="display:none">

<div class="card">

<button onclick="toggleTheme()">Light / Dark Mode</button>

</div>

</div>


<!-- ADMIN -->

<div id="admin" style="display:none">

<div class="card">

<button onclick="loadUsers()">Load Users</button>

<table class="table" id="adminUsers"></table>

</div>

</div>

</div>


<script src="js/app.js"></script>
<script src="js/mining.js"></script>
<script src="js/referral.js"></script>
<script src="js/admin.js"></script>
<script src="js/charts.js"></script>

</body>
</html>
