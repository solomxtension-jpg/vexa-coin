<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Secure Mining</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:40px;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:350px;
  margin:auto;
  box-shadow:0 0 20px #00f0ff33;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:10px;
}
button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>VEXA Secure Mining</h2>

<div id="authSection">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<div id="appSection" style="display:none;">
<h3 id="balance">Balance: 0 VEXA</h3>
<button onclick="startMining()">Start Mining</button>
<button onclick="logout()">Logout</button>
</div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  'https://qmcjmnugpujsqabqejpx.supabase.co',
  'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

let currentUser = null;
let miningInterval;

async function signUp(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if(error){ alert(error.message); return; }

  alert("Check your email to confirm account.");
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){ alert(error.message); return; }

  currentUser = data.user;

  document.getElementById("authSection").style.display="none";
  document.getElementById("appSection").style.display="block";

  loadBalance();
}

async function loadBalance(){

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', currentUser.id)
    .single();

  if(!data){
    await supabaseClient.from('users').insert({
      username: currentUser.id,
      balance: 0
    });
    document.getElementById("balance").innerText =
      "Balance: 0 VEXA";
  }else{
    document.getElementById("balance").innerText =
      "Balance: " + data.balance + " VEXA";
  }
}

async function startMining(){

  if(miningInterval) return;

  miningInterval = setInterval(async () => {

    await supabaseClient.rpc('mine_coin', {
      uid: currentUser.id
    });

    loadBalance();

  }, 5000);
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

</script>

</body>
</html>
