<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO v4</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ===== BODY ===== */
body {
  margin: 0;
  font-family: 'Arial', sans-serif;
  background: linear-gradient(135deg, #0b0f1a, #1c1f2a);
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* ===== CARD ===== */
.card {
  background: #111827;
  padding: 30px;
  border-radius: 20px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 0 40px rgba(0, 229, 255, 0.3);
  position: relative;
  overflow: hidden;
}

/* ===== HEADINGS ===== */
h1, h2 {
  text-align: center;
  color: #22d3ee;
  margin-bottom: 10px;
}

/* ===== INPUTS ===== */
input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

/* ===== BUTTONS ===== */
button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  font-size: 18px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  background: #22d3ee;
  color: black;
  transition: 0.3s;
}
button:hover { opacity: 0.9; }
button.secondary {
  background: #1f2937;
  color: white;
}

/* ===== HIDDEN ===== */
.hidden { display: none; }

/* ===== MINING BUTTON ANIMATION ===== */
.mineBtn.active {
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0% { box-shadow:0 0 10px #22d3ee; }
  50% { box-shadow:0 0 35px #22d3ee; }
  100% { box-shadow:0 0 10px #22d3ee; }
}

/* ===== MINING PROGRESS BAR ===== */
#progressContainer {
  width: 100%;
  height: 15px;
  background: #1f2937;
  border-radius: 10px;
  margin: 10px 0;
  overflow: hidden;
}
#progressBar {
  width: 0%;
  height: 100%;
  background: #22d3ee;
  border-radius: 10px;
  transition: width 0.2s linear;
}

/* ===== FLOATING COINS ===== */
.floating-coin {
  position: absolute;
  font-size: 22px;
  animation: floatUp 1s forwards;
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-60px); }
}

</style>
</head>

<body>

<div class="card">

  <!-- LOGIN / SIGNUP -->
  <div id="auth">
    <h1>VEXA Mining PRO</h1>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <input id="refInput" type="text" placeholder="Referral code (optional)">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="login()">Login</button>
    <p id="authMsg"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="app" class="hidden">
    <h1>Dashboard</h1>
    <p>Balance: <b><span id="balance">0</span></b> VEXA</p>
    <p>Mining Rate: <b><span id="rate">1</span></b>/tick</p>
    <p>Mining Status: <b id="miningStatus">Inactive</b></p>

    <button id="mineBtn" class="mineBtn" onclick="startMining()">⛏ Start Mining</button>
    <button onclick="stopMining()" class="secondary">Stop Mining</button>

    <div id="progressContainer"><div id="progressBar"></div></div>

    <h2>Upgrades</h2>
    <button onclick="buyUpgrade('autoPower', 10)">Auto Power (+1) - 10 VEXA</button>
    <button onclick="buyUpgrade('multiplier', 25)">Multiplier x2 - 25 VEXA</button>
    <button onclick="buyUpgrade('speed', 50)">Faster Mining - 50 VEXA</button>

    <button onclick="logout()" class="secondary">Logout</button>
  </div>

</div>

<script>
/* ================= SUPABASE CONFIG ================= */
const SUPABASE_URL = "https://kdmknilstonmiesjocvy.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */
let currentUser = null;
let coins = 0;
let autoPower = 1;
let multiplier = 1;
let miningSpeed = 5000;
let miningInterval = null;
let progressInterval = null;
let mining = false;

/* ================= AUTH ================= */
async function signUp(){
  const email = emailInput.value;
  const password = passwordInput.value;
  const referral = refInput.value;

  const { data, error } = await supabase.auth.signUp({ email, password });
  if(error){ authMsg.innerText = error.message; return; }

  // Create user in DB
  const code = Math.random().toString(36).substring(2, 8);
  await supabase.from("users").insert({
    id: data.user.id,
    coins: 0,
    auto_power:1,
    multiplier:1,
    speed:5000,
    referral_code: code,
    referred_by: referral || null
  });

  // Give referral bonus
  if(referral){
    const { data: refUser } = await supabase.from("users").select("*").eq("referral_code", referral).single();
    if(refUser){
      await supabase.from("users").update({ coins: refUser.coins + 0.1 }).eq("id", refUser.id);
    }
  }

  authMsg.innerText = "Signup successful! Login now.";
}

async function login(){
  const email = emailInput.value;
  const password = passwordInput.value;
  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ authMsg.innerText = error.message; return; }

  currentUser = data.user;
  auth.classList.add("hidden");
  app.classList.remove("hidden");
  loadUser();
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

/* ================= LOAD USER ================= */
async function loadUser(){
  const { data } = await supabase.from("users").select("*").eq("id", currentUser.id).single();
  if(!data){
    await supabase.from("users").insert({ id: currentUser.id, coins:0, auto_power:1, multiplier:1, speed:5000 });
    coins = 0;
  } else {
    coins = data.coins || 0;
    autoPower = data.auto_power || 1;
    multiplier = data.multiplier || 1;
    miningSpeed = data.speed || 5000;
  }
  updateUI();
}

/* ================= MINING ================= */
function startMining(){
  if(mining) return;
  mining = true;
  mineBtn.classList.add("active");
  miningStatus.innerText = "Active";

  // Animate progress bar every second
  progressInterval = setInterval(()=>{
    let width = parseInt(progressBar.style.width) || 0;
    width += 2;
    if(width>100) width=0;
    progressBar.style.width = width+"%";
    showCoin();
  }, 1000);

  // Add coins every 60 seconds
  miningInterval = setInterval(async ()=>{
    const miningAmount = 0.001 * autoPower * multiplier;
    coins = Number(coins) + miningAmount;

    const { error } = await supabase.from("users").update({ coins }).eq("id", currentUser.id);
    if(error) console.log(error);

    updateUI();
  }, 60000);
}

function stopMining(){
  mining = false;
  mineBtn.classList.remove("active");
  miningStatus.innerText = "Inactive";
  clearInterval(miningInterval);
  clearInterval(progressInterval);
  progressBar.style.width = "0%";
}

/* ================= UPGRADES ================= */
async function buyUpgrade(type, cost){
  if(coins < cost){ alert("Not enough coins"); return; }
  coins -= cost;
  if(type==="autoPower") autoPower += 1;
  if(type==="multiplier") multiplier *= 2;
  if(type==="speed") miningSpeed = Math.max(1000, miningSpeed - 500);

  await supabase.from("users").update({ coins, auto_power:autoPower, multiplier, speed:miningSpeed }).eq("id", currentUser.id);
  stopMining(); startMining(); updateUI();
}

/* ================= UI ================= */
function updateUI(){
  balance.innerText = coins.toFixed(6);
  rate.innerText = (autoPower * multiplier).toFixed(1);
}

function showCoin(){
  const coin = document.createElement("div");
  coin.className = "floating-coin";
  coin.innerText = "🪙";
  document.querySelector(".card").appendChild(coin);
  coin.style.left = Math.random() * 80 + "%";
  setTimeout(()=>coin.remove(), 1000);
}

/* ================= AUTO LOGIN ================= */
(async()=>{
  const { data:{ session } } = await supabase.auth.getSession();
  if(session){
    currentUser = session.user;
    auth.classList.add("hidden");
    app.classList.remove("hidden");
    loadUser();
  }
})();
</script>

</body>
</html>
