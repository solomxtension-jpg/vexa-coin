<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEXA Miner</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; background: #1a1a1a; color: #fff; }
    h1 { color: #00ffea; }
    #coins { font-size: 2rem; margin: 1rem 0; }
    button { padding: 1rem 2rem; font-size: 1rem; margin-top: 1rem; cursor: pointer; background: #00ffea; border: none; border-radius: 8px; color: #000; }
    button:disabled { background: #555; cursor: not-allowed; }
    #message { margin-top: 1rem; font-size: 1rem; color: #ffea00; }
  </style>
</head>
<body>

  <h1>VEXA Miner</h1>
  <div>Your Coins:</div>
  <div id="coins">0</div>
  <button id="mineBtn">Mine Coins</button>
  <div id="message"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const coinsDiv = document.getElementById('coins');
    const mineBtn = document.getElementById('mineBtn');
    const messageDiv = document.getElementById('message');

    let user = null;
    let coins = 0;

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        const { data, error } = await supabase.auth.signInWithOAuth({ provider: 'github' });
        // User will sign in via GitHub popup
        return;
      }
      user = session.user;
      await loadCoins();
    }

    async function loadCoins() {
      const { data, error } = await supabase
        .from('users')
        .select('coins')
        .eq('id', user.id)
        .single();
      if (error) {
        console.error(error);
        messageDiv.textContent = 'Error loading coins!';
        return;
      }
      coins = data.coins || 0;
      coinsDiv.textContent = coins;
    }

    async function mineCoins() {
      mineBtn.disabled = true;
      messageDiv.textContent = 'Mining... ⛏️';

      // simulate mining delay
      await new Promise(res => setTimeout(res, 1500));

      const earned = Math.floor(Math.random() * 10) + 1; // 1–10 coins
      coins += earned;
      coinsDiv.textContent = coins;

      // Update Supabase
      const { error } = await supabase
        .from('users')
        .upsert({ id: user.id, coins }, { onConflict: 'id' });
      if (error) {
        console.error(error);
        messageDiv.textContent = 'Error saving coins!';
      } else {
        messageDiv.textContent = `You mined ${earned} coins! 🎉`;
      }

      mineBtn.disabled = false;
    }

    mineBtn.addEventListener('click', mineCoins);
    init();
  </script>
</body>
</html>
