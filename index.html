<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:30px;
}

.card{
  background:#11182b;
  padding:30px;
  border-radius:15px;
  width:360px;
  margin:auto;
  margin-bottom:20px;
  box-shadow:0 0 20px #00f0ff33;
}

button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:80%;
  margin-bottom:10px;
}

h3,h4{margin:10px 0;}
#leaderboard {text-align:left; margin:10px auto; max-width:360px;}
</style>
</head>

<body>

<div class="card">
<h2>VEXA COIN MINING PRO</h2>

<input id="username" placeholder="Enter Username" onkeyup="loadBalance()">

<h3 id="balance">Balance: 0 VEXA</h3>

<button onclick="startMining()">Start Mining</button>
<button onclick="claimDailyReward()">Claim Daily Reward</button>
<button onclick="toggleBoost()">Toggle Speed Boost</button>
</div>

<div class="card" id="leaderboard">
<h4>Leaderboard</h4>
<ul id="leaderboardList"></ul>
</div>

<script>
// -------------------- Supabase --------------------
const supabaseClient = window.supabase.createClient(
  'https://qmcjmnugpujsqabqejpx.supabase.co',
  'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

// -------------------- Global variables --------------------
let mining = false;
let miningInterval;
let boost = false;

// -------------------- Auto-load balance --------------------
async function loadBalance() {
  const username = document.getElementById("username").value;
  if (!username) return;

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if (data) {
    document.getElementById("balance").innerText =
      "Balance: " + data.balance + " VEXA";
  } else {
    document.getElementById("balance").innerText = "Balance: 0 VEXA";
  }

  updateLeaderboard();
}

// -------------------- Mining function --------------------
async function startMining() {
  const username = document.getElementById("username").value;
  if (!username) { alert("Enter username first"); return; }

  // Load current balance
  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if (!data) {
    await supabaseClient.from('users').insert({
      username: username,
      balance: 0,
      last_daily: null
    });
    data = { balance:0, last_daily:null };
  }

  document.getElementById("balance").innerText =
    "Balance: " + data.balance + " VEXA";

  if (mining) return;
  mining = true;

  miningInterval = setInterval(async () => {
    let { data } = await supabaseClient
      .from('users')
      .select('*')
      .eq('username', username)
      .single();

    if (data) {
      let increment = boost ? 3 : 1; // boost multiplies mining
      let newBalance = data.balance + increment;

      await supabaseClient
        .from('users')
        .update({ balance: newBalance })
        .eq('username', username);

      document.getElementById("balance").innerText =
        "Balance: " + newBalance + " VEXA";

      updateLeaderboard();
    }
  }, boost ? 2000 : 5000); // faster if boost
}

// -------------------- Daily reward --------------------
async function claimDailyReward() {
  const username = document.getElementById("username").value;
  if (!username) { alert("Enter username first"); return; }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if (!data) { alert("User not found"); return; }

  let lastDaily = data.last_daily ? new Date(data.last_daily) : null;
  let now = new Date();

  if (lastDaily && lastDaily.toDateString() === now.toDateString()) {
    alert("You already claimed your daily reward today!");
    return;
  }

  let reward = 10; // daily VEXA bonus
  let newBalance = data.balance + reward;

  await supabaseClient
    .from('users')
    .update({ balance: newBalance, last_daily: now })
    .eq('username', username);

  document.getElementById("balance").innerText =
    "Balance: " + newBalance + " VEXA";

  alert("Daily reward claimed: +" + reward + " VEXA");
  updateLeaderboard();
}

// -------------------- Mining speed boost toggle --------------------
function toggleBoost() {
  boost = !boost;
  clearInterval(miningInterval);
  mining = false;
  startMining();
  alert(boost ? "Speed Boost Activated!" : "Speed Boost Deactivated!");
}

// -------------------- Leaderboard --------------------
async function updateLeaderboard() {
  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .order('balance', { ascending: false })
    .limit(5);

  let list = document.getElementById("leaderboardList");
  list.innerHTML = "";
  if(data){
    data.forEach((user, index) => {
      list.innerHTML += `<li>${index+1}. ${user.username} - ${user.balance} VEXA</li>`;
    });
  }
}

</script>
</body>
</html>
