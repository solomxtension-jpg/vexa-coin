<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:20px;
}

.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:370px;
  margin:auto;
  margin-bottom:20px;
  box-shadow:0 0 20px #00f0ff33;
}

button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:8px;
}

h3,h4{margin:8px 0;}
#leaderboard {text-align:left;}
hr{margin:15px 0;}
</style>
</head>

<body>

<div class="card">

<h2>VEXA COIN MINING PRO</h2>

<input id="username" placeholder="Enter Username" onkeyup="loadBalance()">

<h3 id="balance">Balance: 0 VEXA</h3>

<button onclick="startMining()">Start Mining</button>
<button onclick="toggleBoost()">Toggle Speed Boost</button>
<button onclick="claimDailyReward()">Claim Daily Reward</button>

<hr>

<h4>Withdraw VEXA</h4>

<input id="withdrawAmount" placeholder="Amount (min 50)">
<input id="walletAddress" placeholder="Wallet Address">
<button onclick="withdrawCoins()">Withdraw</button>

</div>

<div class="card" id="leaderboard">
<h4>Leaderboard (Top 5)</h4>
<ul id="leaderboardList"></ul>
</div>

<script>

const supabaseClient = window.supabase.createClient(
  'https://qmcjmnugpujsqabqejpx.supabase.co',
  'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

let mining = false;
let miningInterval;
let boost = false;

async function loadBalance(){
  const username = document.getElementById("username").value;
  if(!username) return;

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(data){
    document.getElementById("balance").innerText =
      "Balance: " + data.balance + " VEXA";
  }

  updateLeaderboard();
}

async function startMining(){

  const username = document.getElementById("username").value;
  if(!username){ alert("Enter username first"); return; }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(!data){
    await supabaseClient.from('users').insert({
      username: username,
      balance: 0,
      last_daily: null
    });
    data = { balance: 0 };
  }

  document.getElementById("balance").innerText =
    "Balance: " + data.balance + " VEXA";

  if(mining) return;
  mining = true;

  miningInterval = setInterval(async () => {

    let { data } = await supabaseClient
      .from('users')
      .select('*')
      .eq('username', username)
      .single();

    if(data){
      let increment = boost ? 3 : 1;
      let newBalance = data.balance + increment;

      await supabaseClient
        .from('users')
        .update({ balance: newBalance })
        .eq('username', username);

      document.getElementById("balance").innerText =
        "Balance: " + newBalance + " VEXA";

      updateLeaderboard();
    }

  }, boost ? 2000 : 5000);
}

function toggleBoost(){
  boost = !boost;
  clearInterval(miningInterval);
  mining = false;
  startMining();
  alert(boost ? "Speed Boost Activated!" : "Speed Boost Deactivated!");
}

async function claimDailyReward(){

  const username = document.getElementById("username").value;
  if(!username){ alert("Enter username first"); return; }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(!data){ alert("User not found"); return; }

  let lastDaily = data.last_daily ? new Date(data.last_daily) : null;
  let now = new Date();

  if(lastDaily && lastDaily.toDateString() === now.toDateString()){
    alert("Already claimed today!");
    return;
  }

  let reward = 10;
  let newBalance = data.balance + reward;

  await supabaseClient
    .from('users')
    .update({ balance: newBalance, last_daily: now })
    .eq('username', username);

  document.getElementById("balance").innerText =
    "Balance: " + newBalance + " VEXA";

  alert("Daily reward +10 VEXA");
  updateLeaderboard();
}

async function withdrawCoins(){

  const username = document.getElementById("username").value;
  const amount = parseInt(document.getElementById("withdrawAmount").value);
  const wallet = document.getElementById("walletAddress").value;

  if(!username || !amount || !wallet){
    alert("Fill all fields");
    return;
  }

  if(amount < 50){
    alert("Minimum withdrawal is 50 VEXA");
    return;
  }

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', username)
    .single();

  if(!data){ alert("User not found"); return; }

  if(data.balance < amount){
    alert("Not enough balance");
    return;
  }

  let newBalance = data.balance - amount;

  await supabaseClient
    .from('users')
    .update({ balance: newBalance })
    .eq('username', username);

  await supabaseClient
    .from('withdrawals')
    .insert({
      username: username,
      amount: amount,
      wallet: wallet,
      status: "pending"
    });

  document.getElementById("balance").innerText =
    "Balance: " + newBalance + " VEXA";

  alert("Withdrawal request sent!");
  updateLeaderboard();
}

async function updateLeaderboard(){

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .order('balance', { ascending: false })
    .limit(5);

  let list = document.getElementById("leaderboardList");
  list.innerHTML = "";

  if(data){
    data.forEach((user, index) => {
      list.innerHTML += `<li>${index+1}. ${user.username} - ${user.balance} VEXA</li>`;
    });
  }
}

</script>
</body>
</html>
