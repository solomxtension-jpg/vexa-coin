<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  background: #0b0f1a;
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #111827;
  padding: 25px;
  border-radius: 12px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 0 25px rgba(0,229,255,0.25);
  position: relative;
}
input, button {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  border-radius: 8px;
  border: none;
}
button {
  background: #22d3ee;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
button.secondary {
  background: #1c2747;
  color: white;
}
button:disabled {
  opacity: 0.5;
}
.hidden { display: none; }

.floating-coin {
  position: absolute;
  font-size: 22px;
  animation: floatUp 1s forwards;
}
@keyframes floatUp {
  from {opacity: 1; transform: translateY(0);}
  to {opacity: 0; transform: translateY(-60px);}
}
</style>
</head>
<body>

<div class="card">

  <!-- AUTH -->
  <div id="auth">
    <h2>VEXA Mining PRO</h2>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="login()">Login</button>
    <p id="authMsg"></p>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <h2>Dashboard</h2>

    <p>Balance: <b><span id="balance">0</span></b> VEXA</p>
    <p>Mined Today: <b><span id="today">0</span></b></p>
    <p>Level: <b><span id="level">1</span></b></p>
    <p>Tap Power: <b><span id="rate">1</span></b> / tap</p>

    <button id="mineBtn" onclick="tapMine()">⛏️ TAP TO MINE</button>
    <button onclick="upgrade()" class="secondary">⚡ Upgrade Miner (10 VEXA)</button>
    <button onclick="logout()" class="secondary">Logout</button>

    <p id="msg"></p>
  </div>

</div>

<script>
/* =====================
SUPABASE CONFIG
===================== */
const SUPABASE_URL = "https://qmcjmnugpujsqabqejpx.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY_HERE"; // keep anon key only

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================
STATE
===================== */
let currentUser = null;
let isMining = false;

/* =====================
AUTH
===================== */
async function signUp() {
  const email = emailInput.value;
  const password = passwordInput.value;
  const { error } = await supabase.auth.signUp({ email, password });
  authMsg.innerText = error ? error.message : "Signup successful. Login now.";
}

async function login() {
  const { data, error } = await supabase.auth.signInWithPassword({
    email: emailInput.value,
    password: passwordInput.value
  });

  if (error) return authMsg.innerText = error.message;

  currentUser = data.user;
  auth.classList.add("hidden");
  app.classList.remove("hidden");
  loadUser();
}

async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

/* =====================
LOAD USER
===================== */
async function loadUser() {
  const { data } = await supabase
    .from("users")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (!data) {
    await supabase.from("users").insert({
      id: currentUser.id,
      balance: 0,
      coins_today: 0,
      level: 1
    });
    return loadUser();
  }

  balance.innerText = data.balance;
  today.innerText = data.coins_today;
  level.innerText = data.level;
  rate.innerText = data.level;
}

/* =====================
TAP TO MINE
===================== */
async function tapMine() {
  if (!currentUser || isMining) return;

  isMining = true;
  mineBtn.disabled = true;
  msg.innerText = "Mining...";

  const { error } = await supabase.rpc("mine_coin", {
    uid: currentUser.id
  });

  if (error) {
    msg.innerText = error.message;
  } else {
    showFloatingCoin();
    await loadUser();
    msg.innerText = "⛏️ +VEXA mined!";
  }

  setTimeout(() => {
    isMining = false;
    mineBtn.disabled = false;
  }, 500);
}

/* =====================
UPGRADE
===================== */
async function upgrade() {
  const { error } = await supabase.rpc("upgrade_miner", {
    uid: currentUser.id
  });

  if (error) msg.innerText = error.message;
  else loadUser();
}

/* =====================
ANIMATION
===================== */
function showFloatingCoin() {
  const coin = document.createElement("div");
  coin.className = "floating-coin";
  coin.innerText = "🪙";
  coin.style.left = Math.random() * 80 + "%";
  document.querySelector(".card").appendChild(coin);
  setTimeout(() => coin.remove(), 1000);
}

/* =====================
AUTO LOGIN
===================== */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    currentUser = session.user;
    auth.classList.add("hidden");
    app.classList.remove("hidden");
    loadUser();
  }
})();
</script>

</body>
</html>
