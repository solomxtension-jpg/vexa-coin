<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
background:#0b0f1a;
color:white;
font-family:Arial;
text-align:center;
padding-top:60px;
}

.card{
background:#11182b;
padding:30px;
border-radius:15px;
width:320px;
margin:auto;
box-shadow:0 0 20px #00f0ff33;
}

button{
background:#00e5ff;
color:black;
border:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
margin-top:15px;
cursor:pointer;
}

input{
padding:10px;
border-radius:8px;
border:none;
width:80%;
margin-bottom:10px;
}
</style>
</head>

<body>

<div class="card">

<h2>VEXA COIN MINING</h2>

<input id="username" placeholder="Enter Username">

<h3 id="balance">Balance: 0 VEXA</h3>

<button onclick="startMining()">Start Mining</button>

</div>

<script>
const supabaseClient = window.supabase.createClient(
'https://qmcjmnugpujsqabqejpx.supabase.co',
'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

let mining = false;

async function startMining(){

const username = document.getElementById("username").value;

if(!username){
alert("Enter username first");
return;
}

mining = true;

setInterval(async () => {

let { data } = await supabaseClient
.from('users')
.select('*')
.eq('username', username)
.single();

if(!data){
await supabaseClient.from('users').insert({
username: username,
balance: 0
});
return;
}

let newBalance = data.balance + 1;

await supabaseClient
.from('users')
.update({ balance: newBalance })
.eq('username', username);

document.getElementById("balance").innerText =
"Balance: " + newBalance + " VEXA";

}, 5000);
}
</script>

</body>
</html>
