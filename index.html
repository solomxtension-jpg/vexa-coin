<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
  background: linear-gradient(135deg, #0b0f1a, #1c1f2a);
  color: #fff;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #111827;
  padding: 30px;
  border-radius: 20px;
  max-width: 450px;
  width: 100%;
  box-shadow: 0 0 30px rgba(0,229,255,0.25);
  position: relative;
  overflow: hidden;
}
input, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}
button {
  background: #22d3ee;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
button.secondary {
  background: #1c2747;
  color: white;
}
.hidden { display: none; }
#progressContainer {
  width: 100%;
  height: 20px;
  background: #1c2747;
  border-radius: 12px;
  margin-top: 15px;
  overflow: hidden;
}
#progressBar {
  height: 100%;
  width: 0%;
  background: #00e5ff;
  transition: width 0.2s linear;
}
.floating-coin {
  position: absolute;
  font-size: 24px;
  animation: floatUp 1s forwards;
}
@keyframes floatUp {
  from {opacity: 1; transform: translateY(0);}
  to {opacity: 0; transform: translateY(-60px);}
}
h2 { text-align: center; color: #00e5ff; }
</style>
</head>
<body>

<div class="card">

  <!-- AUTH -->
  <div id="auth">
    <h2>VEXA Mining PRO</h2>
    <input id="emailInput" type="email" placeholder="Email">
    <input id="passwordInput" type="password" placeholder="Password">
    <button onclick="signUp()">Sign Up</button>
    <button onclick="login()">Login</button>
    <p id="authMsg"></p>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <h2>Dashboard</h2>
    <p>Balance: <b><span id="balance">0</span></b> VEXA</p>
    <p>Mining Rate: <b><span id="rate">1</span></b>/tick</p>

    <button onclick="startMining()">⛏️ Start Mining</button>
    <button onclick="stopMining()" class="secondary">Stop Mining</button>

    <div id="progressContainer">
      <div id="progressBar"></div>
    </div>

    <h3>Upgrades</h3>
    <button onclick="buyUpgrade('autoPower', 10)">Auto Power (+1) - 10</button>
    <button onclick="buyUpgrade('multiplier', 25)">Multiplier x2 - 25</button>
    <button onclick="buyUpgrade('speed', 50)">Faster Mining - 50</button>

    <button onclick="logout()" class="secondary">Logout</button>
  </div>

</div>

<!-- Working Coin Sound -->
<audio id="coinSound" src="https://assets.mixkit.co/sfx/preview/mixkit-coins-handling-1939.mp3"></audio>

<script>
/* ================= SUPABASE CONFIG ================= */

const SUPABASE_URL = "https://kdmknilstonmiesjocvy.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLIC_ANON_KEY_HERE"; // <-- PUT YOUR REAL ANON KEY

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ================= STATE ================= */

let currentUser = null;
let coins = 0;
let autoPower = 1;
let multiplier = 1;
let miningSpeed = 5000;
let miningInterval = null;
let progressInterval = null;

/* ================= AUTH ================= */

async function signUp() {
  const email = emailInput.value;
  const password = passwordInput.value;
  const { error } = await client.auth.signUp({ email, password });
  authMsg.innerText = error ? error.message : "Signup successful. Login now.";
}

async function login() {
  const email = emailInput.value;
  const password = passwordInput.value;

  const { data, error } = await client.auth.signInWithPassword({ email, password });

  if (error) {
    authMsg.innerText = error.message;
    return;
  }

  currentUser = data.user;

  auth.classList.add("hidden");
  app.classList.remove("hidden");

  loadUser();
}

async function logout() {
  await client.auth.signOut();
  location.reload();
}

/* ================= LOAD USER ================= */

async function loadUser() {
  const { data } = await client
    .from("users")
    .select("*")
    .eq("id", currentUser.id)
    .single();

  if (!data) {
    await client.from("users").insert({
      id: currentUser.id,
      coins: 0,
      auto_power: 1,
      multiplier: 1,
      speed: 5000
    });
    coins = 0;
  } else {
    coins = data.coins;
    autoPower = data.auto_power;
    multiplier = data.multiplier;
    miningSpeed = data.speed;
  }

  updateUI();
}

/* ================= MINING ================= */

function startMining() {
  if (miningInterval) return;

  let progress = 0;
  progressInterval = setInterval(() => {
    progress += 2;
    if (progress > 100) progress = 0;
    progressBar.style.width = progress + "%";
  }, 100);

  miningInterval = setInterval(async () => {

    const res = await fetch("https://kdmknilstonmiesjocvy.supabase.co/functions/v1/mine_coin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId: currentUser.id })
    });

    const data = await res.json();
    coins = data.coins;

    updateUI();
    showCoin();
    coinSound.play();

  }, miningSpeed);
}

function stopMining() {
  clearInterval(miningInterval);
  clearInterval(progressInterval);
  miningInterval = null;
  progressBar.style.width = "0%";
}

/* ================= UPGRADES ================= */

async function buyUpgrade(type, cost) {
  if (coins < cost) return alert("Not enough coins");

  coins -= cost;

  if (type === "autoPower") autoPower += 1;
  if (type === "multiplier") multiplier *= 2;
  if (type === "speed") miningSpeed = Math.max(1000, miningSpeed - 500);

  await client.from("users")
    .update({ coins, auto_power: autoPower, multiplier, speed: miningSpeed })
    .eq("id", currentUser.id);

  stopMining();
  startMining();
  updateUI();
}

/* ================= UI ================= */

function updateUI() {
  balance.innerText = coins;
  rate.innerText = autoPower * multiplier;
}

function showCoin() {
  const coin = document.createElement("div");
  coin.className = "floating-coin";
  coin.innerText = "🪙";
  document.querySelector(".card").appendChild(coin);
  coin.style.left = Math.random() * 80 + "%";
  setTimeout(() => coin.remove(), 1000);
}

/* ================= AUTO LOGIN ================= */

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) {
    currentUser = session.user;
    auth.classList.add("hidden");
    app.classList.remove("hidden");
    loadUser();
  }
})();
</script>

</body>
</html>
