<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:40px;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:350px;
  margin:auto;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:10px;
}
button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
<h2>VEXA Mining PRO</h2>

<div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<div id="app" style="display:none;">
<h3 id="status">Logged in</h3>
<button onclick="logout()">Logout</button>
</div>
</div>

<script>
const supabase = window.supabase.createClient(
  "https://qmcjmnugpujsqabqejpx.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY2ptbnVncHVqc3FhYnFlanB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NDEyNDQsImV4cCI6MjA4NzExNzI0NH0.U0Sl5wmt6CHrwOgoV5bSJYG1PuHjumDr23v65tAnLqo"
);

async function signup(){
  const email = emailInput();
  const password = passwordInput();

  const { error } = await supabase.auth.signUp({ email, password });

  if(error) return alert(error.message);
  alert("Signup successful. Check email if required.");
}

async function login(){
  const email = emailInput();
  const password = passwordInput();

  const { data, error } =
    await supabase.auth.signInWithPassword({ email, password });

  if(error) return alert(error.message);

  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "block";
}

async function logout(){
  await supabase.auth.signOut();
  location.reload();
}

function emailInput(){
  return document.getElementById("email").value.trim();
}
function passwordInput(){
  return document.getElementById("password").value.trim();
}
</script>

</body>
</html>
