<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:420px;
background:#111827;
border-radius:18px;
padding:30px;
box-shadow:0 0 30px rgba(0,255,255,.15);
}

h1{
text-align:center;
color:#22d3ee;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:8px;
border:none;
border-radius:8px;
background:#22d3ee;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.secondary{
background:#374151;
}

.hidden{
display:none;
}

.card{
background:#020617;
padding:15px;
border-radius:12px;
margin-top:12px;
}

.stat{
display:flex;
justify-content:space-between;
margin:6px 0;
}

#leaderboard p{
font-size:13px;
margin:3px 0;
}

</style>

</head>

<body>

<div class="container">

<div id="auth">

<h1>VEXA Mining</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="refInput" placeholder="Referral Code (optional)">

<button id="signupBtn">Create Account</button> <button id="loginBtn" class="secondary">Login</button>

<p id="msg"></p>

</div>

<div id="app" class="hidden">

<h1>Dashboard</h1>

<div class="card">

<div class="stat">
<span>Balance</span>
<b id="balance">0</b>
</div>

<div class="stat">
<span>Rate</span>
<b id="rate">0</b>
</div>

<div class="stat">
<span>Referral</span>
<b id="refCode"></b>
</div>

</div>

<button id="mineBtn">⛏ Start Mining</button>

<div class="card">

<h3>Upgrades</h3>

<button id="autoBtn">Auto Power +1 (10)</button> <button id="multiBtn">Multiplier x2 (25)</button>

</div>

<div class="card">

<h3>Daily Bonus</h3>

<button id="dailyBtn">Claim 0.01</button>

</div>

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet address">
<input id="amount" placeholder="Amount">

<button id="withdrawBtn">Request Withdrawal</button>

</div>

<div class="card">

<h3>Top Miners</h3>

<div id="leaderboard"></div>

</div>

<button id="logoutBtn" class="secondary">Logout</button>

</div>

</div>

<script>

const SUPABASE_URL="https://kdmknilstonmiesjocvy.supabase.co"
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE"

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let user=null
let coins=0
let auto=1
let multi=1
let mining=false

function randomCode(){
return Math.random().toString(36).substring(2,8)
}

async function signup(){

const {data,error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error){
msg.innerText=error.message
return
}

await db.from("users").insert({
id:data.user.id,
coins:0,
auto_power:1,
multiplier:1,
referral_code:randomCode(),
referred_by:refInput.value||null
})

msg.innerText="Account created"

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error){
msg.innerText=error.message
return
}

user=data.user

auth.classList.add("hidden")
app.classList.remove("hidden")

loadUser()

}

async function loadUser(){

const {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

coins=data.coins||0
auto=data.auto_power||1
multi=data.multiplier||1

refCode.innerText=data.referral_code||""

updateUI()

leaderboard()

}

function updateUI(){

balance.innerText=coins.toFixed(6)

rate.innerText=(0.001*auto*multi).toFixed(6)

}

function startMining(){

if(mining) return

mining=true

setInterval(async()=>{

let reward=0.001*auto*multi

coins+=reward

await db.from("users").update({
coins:coins
}).eq("id",user.id)

updateUI()

},60000)

}

async function upgradeAuto(){

if(coins<10){
alert("Need 10 coins")
return
}

coins-=10
auto++

await db.from("users").update({
coins:coins,
auto_power:auto
}).eq("id",user.id)

updateUI()

}

async function upgradeMulti(){

if(coins<25){
alert("Need 25 coins")
return
}

coins-=25
multi*=2

await db.from("users").update({
coins:coins,
multiplier:multi
}).eq("id",user.id)

updateUI()

}

async function daily(){

coins+=0.01

await db.from("users").update({
coins:coins
}).eq("id",user.id)

updateUI()

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:amount.value,
wallet:wallet.value
})

alert("Withdrawal requested")

}

async function leaderboard(){

const {data}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

leaderboard.innerHTML=""

if(!data) return

data.forEach(u=>{
leaderboard.innerHTML+=
`<p>${Number(u.coins||0).toFixed(3)} VEXA</p>`
})

}

async function logout(){

await db.auth.signOut()

location.reload()

}

document.getElementById("signupBtn").onclick=signup
document.getElementById("loginBtn").onclick=login
document.getElementById("mineBtn").onclick=startMining
document.getElementById("autoBtn").onclick=upgradeAuto
document.getElementById("multiBtn").onclick=upgradeMulti
document.getElementById("dailyBtn").onclick=daily
document.getElementById("withdrawBtn").onclick=withdraw
document.getElementById("logoutBtn").onclick=logout

</script>

</body>
</html>
