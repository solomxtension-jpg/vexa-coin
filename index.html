<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<link rel="manifest" href="manifest.json">

<style>
body{
  background:#0b0f1a;
  color:#ffffff;
  font-family: Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:16px;
  width:340px;
  box-shadow:0 0 25px rgba(0,229,255,.2);
  text-align:center;
}
input{
  width:90%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}
button{
  width:95%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#1c2747;
  color:#fff;
}
hr{margin:15px 0; border-color:#00e5ff33;}
</style>
</head>
<body>

<div class="card">
<h2>VEXA Mining PRO</h2>

<!-- Authentication -->
<div id="authBox">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signupBtn">Sign Up</button>
<button id="loginBtn" class="secondary">Login</button>
</div>

<!-- App Section -->
<div id="appBox" style="display:none;">
<h3 id="balance">Balance: 0 VEXA</h3>
<h4 id="level">Level: 1</h4>
<h4 id="cps">Mining rate: 0 VEXA / 5s</h4>
<h4 id="today">Mined today: 0 VEXA</h4>

<button id="mineBtn">Start Mining</button>
<button id="stopMineBtn" class="secondary">Stop Mining</button>
<button id="upgradeBtn">Upgrade Miner</button>

<hr>

<h4>Withdraw</h4>
<input id="withdrawAmount" placeholder="Amount to withdraw">
<input id="walletAddress" placeholder="Wallet address">
<button id="withdrawBtn">Request Withdrawal</button>

<br><br>
<button id="logoutBtn">Logout</button>
</div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// -----------------------------
// Supabase Init
// -----------------------------
const SUPABASE_URL = "https://qmcjmnugpujsqabqejpx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY2ptbnVncHVqc3FhYnFlanB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NDEyNDQsImV4cCI6MjA4NzExNzI0NH0.U0Sl5wmt6CHrwOgoV5bSJYG1PuHjumDr23v65tAnLqo";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authBox = document.getElementById("authBox");
const appBox = document.getElementById("appBox");

const balanceText = document.getElementById("balance");
const levelText = document.getElementById("level");
const cpsText = document.getElementById("cps");
const todayText = document.getElementById("today");

let miningInterval = null;

// -------------------- SIGNUP --------------------
document.getElementById("signupBtn").addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if(!email || !password){ alert("Enter email and password"); return; }

  const { error } = await supabase.auth.signUp({ email, password });
  if(error){ alert(error.message); return; }

  alert("Signup successful. Now login.");
});

// -------------------- LOGIN --------------------
document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();

  const { error, data } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ alert(error.message); return; }

  authBox.style.display = "none";
  appBox.style.display = "block";

  await ensureUserRow();
  loadUser();
});

// -------------------- LOGOUT --------------------
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await supabase.auth.signOut();
  location.reload();
});

// -------------------- ENSURE USER ROW EXISTS --------------------
async function ensureUserRow(){
  const user = supabase.auth.getUser().data.user;
  if(!user) return;

  const { data } = await supabase
    .from('users')
    .select('*')
    .eq('id', user.id)
    .single();

  if(!data){
    await supabase.from('users').insert({
      id: user.id,
      balance: 0,
      level: 1,
      coins_today: 0
    });
  }
}

// -------------------- LOAD USER + CPS + TODAY --------------------
async function loadUser(){
  const user = supabase.auth.getUser().data.user;
  if(!user) return;

  const { data, error } = await supabase
    .from('users')
    .select('*')
    .eq('id', user.id)
    .single();
  if(error){ console.log(error.message); return; }

  balanceText.innerText = "Balance: " + data.balance + " VEXA";
  levelText.innerText = "Level: " + data.level;
  const cps = 1 * data.level;
  cpsText.innerText = `Mining rate: ${cps} VEXA / 5s`;
  todayText.innerText = `Mined today: ${data.coins_today || 0} VEXA`;
}

// -------------------- START MINING --------------------
document.getElementById("mineBtn").addEventListener("click", () => {
  if(miningInterval) return;

  miningInterval = setInterval(async () => {
    const user = supabase.auth.getUser().data.user;
    if(!user) return;

    const { error } = await supabase.rpc('mine_coin', { uid: user.id });
    if(error){ console.log("Mining error:", error.message); return; }

    loadUser();
  }, 5000);

  alert("Mining started! Coins are added automatically.");
});

// -------------------- STOP MINING --------------------
document.getElementById("stopMineBtn").addEventListener("click", () => {
  if(miningInterval){
    clearInterval(miningInterval);
    miningInterval = null;
    alert("Mining stopped.");
  }
});

// -------------------- UPGRADE MINER --------------------
document.getElementById("upgradeBtn").addEventListener("click", async () => {
  const user = supabase.auth.getUser().data.user;
  if(!user) return;

  const { error } = await supabase.rpc('upgrade_miner', { uid: user.id });
  if(error){ console.log("Upgrade error:", error.message); return; }

  loadUser();
});

// -------------------- WITHDRAW --------------------
document.getElementById("withdrawBtn").addEventListener("click", async () => {
  const amount = parseInt(document.getElementById("withdrawAmount").value);
  const wallet = document.getElementById("walletAddress").value;
  const user = supabase.auth.getUser().data.user;

  if(!amount || !wallet){ alert("Enter amount and wallet"); return; }

  const { error } = await supabase.rpc('request_withdraw', {
    uid: user.id,
    amt: amount,
    wallet_addr: wallet
  });

  if(error){ console.log("Withdraw error:", error.message); return; }

  alert("Withdrawal request submitted.");
  loadUser();
});

// -------------------- LIVE CPS + TODAY UPDATE --------------------
setInterval(() => {
  const level = parseInt(levelText.innerText.replace("Level: ","")) || 1;
  const cps = 1 * level;
  cpsText.innerText = `Mining rate: ${cps} VEXA / 5s`;
  loadUser();
}, 1000);

</script>

</body>
</html>
