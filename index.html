<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<script type="module">
  // Import Supabase client properly
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  
  // Initialize Supabase client (replace with your anon key)
  const supabase = createClient(
    'https://qmcjmnugpujsqabqejpx.supabase.co',
    'YOUR_ANON_KEY_HERE'
  );

  window.supabase = supabase; // optional for debugging
</script>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/service-worker.js')
  .then(()=>console.log('Service Worker Registered'))
  .catch(err=>console.log(err));
}
</script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:40px;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:350px;
  margin:auto;
  box-shadow:0 0 20px #00f0ff33;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:10px;
}
button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}
hr{margin:15px 0;}
</style>
</head>

<body>

<div class="card">

<h2>VEXA Mining PRO</h2>

<!-- Authentication Section -->
<div id="authSection">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<!-- App Section -->
<div id="appSection" style="display:none;">
<h3 id="balance">Balance: 0 VEXA</h3>
<h4 id="level">Level: 1</h4>

<button onclick="startMining()">Start Mining</button>
<button onclick="upgrade()">Upgrade Miner</button>

<hr>

<h4>Withdraw</h4>
<input id="withdrawAmount" placeholder="Amount to withdraw">
<input id="walletAddress" placeholder="Wallet address">
<button onclick="withdraw()">Request Withdrawal</button>

<br><br>
<button onclick="logout()">Logout</button>
</div>

</div>

<script type="module">
// Supabase client
const supabase = window.supabase;

let currentUser = null;
let miningInterval = null;

// Sign Up
async function signUp(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signUp({ email, password });
  if(error){ alert(error.message); return; }

  alert("Check your email to confirm account.");
}

// Login
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });
  if(error){ alert(error.message); return; }

  currentUser = data.user;

  document.getElementById("authSection").style.display="none";
  document.getElementById("appSection").style.display="block";

  await loadUser();
}

// Load User Data
async function loadUser(){
  const { data, error } = await supabase
    .from('users')
    .select('*')
    .eq('id', currentUser.id) // matches Supabase Auth id
    .single();

  if(error && error.code === 'PGRST116'){ // user not found
    await supabase.from('users').insert({
      id: currentUser.id,
      balance: 0,
      level: 1
    });
    document.getElementById("balance").innerText = "Balance: 0 VEXA";
    document.getElementById("level").innerText = "Level: 1";
  } else if(data){
    document.getElementById("balance").innerText = "Balance: " + data.balance + " VEXA";
    document.getElementById("level").innerText = "Level: " + data.level;
  }
}

// Start Mining
async function startMining(){
  if(miningInterval) return;

  miningInterval = setInterval(async () => {
    const { error } = await supabase.rpc('mine_coin', { uid: currentUser.id });
    if(error){ console.error(error); return; }
    await loadUser();
  }, 5000);
}

// Upgrade Miner
async function upgrade(){
  const { error } = await supabase.rpc('upgrade_miner', { uid: currentUser.id });
  if(error){ console.error(error); return; }
  await loadUser();
}

// Withdraw Request
async function withdraw(){
  const amount = parseInt(document.getElementById("withdrawAmount").value);
  const wallet = document.getElementById("walletAddress").value;

  if(!amount || !wallet){
    alert("Enter amount and wallet");
    return;
  }

  const { error } = await supabase.rpc('request_withdraw', {
    uid: currentUser.id,
    amt: amount,
    wallet_addr: wallet
  });

  if(error){ console.error(error); alert(error.message); return; }

  alert("Withdrawal request submitted.");
  await loadUser();
}

// Logout
async function logout(){
  await supabase.auth.signOut();
  location.reload();
}
</script>

</body>
</html>
