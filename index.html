<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VEXA Mining Ultimate</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
min-height:100vh;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:#020617;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:40px;
height:40px;
border-radius:50%;
background:linear-gradient(45deg,#00f2fe,#4facfe);
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.container{
padding:20px;
max-width:900px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:12px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(0,255,255,0.1);
}

.balance{
font-size:32px;
font-weight:bold;
margin-bottom:10px;
}

.mine-btn{
width:180px;
height:180px;
border-radius:50%;
border:none;
background:linear-gradient(45deg,#00f2fe,#4facfe);
color:white;
font-size:22px;
cursor:pointer;
margin:20px auto;
display:block;
box-shadow:0 0 25px rgba(0,255,255,0.5);
}

.progress{
height:12px;
background:#1e293b;
border-radius:10px;
overflow:hidden;
margin-top:8px;
}

.progress-bar{
height:100%;
background:linear-gradient(90deg,#00f2fe,#4facfe);
width:0%;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
border-radius:8px;
border:none;
}

button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.auth{
max-width:400px;
margin:80px auto;
}

.leaderboard div{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,0.1);
}

.light{
background:#f1f5f9;
color:black;
}

.light header{
background:white;
color:black;
}

</style>
</head>

<body>

<div id="auth" class="auth card">

<h2>VEXA Mining</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button onclick="signup()">Sign Up</button>

</div>

<div id="app" style="display:none">

<header>

<div class="profile">
<div class="avatar" id="avatar">U</div>
<div>
<div id="username">User</div>
<div>Level <span id="level">1</span></div>
</div>
</div>

<div>
<button onclick="toggleTheme()">🌗</button>
<button onclick="logout()">Logout</button>
</div>

</header>

<div class="container">

<div class="card">

<div class="balance" id="coins">0.000</div>

<button class="mine-btn" onclick="mine()">MINE</button>

<div>XP Progress</div>

<div class="progress">
<div class="progress-bar" id="xpbar"></div>
</div>

</div>

<div class="card">

<h3>Daily Reward</h3>

<button onclick="daily()">Claim 0.01</button>

<p>Streak: <span id="streak">0</span></p>

</div>

<div class="card">

<h3>Referral</h3>

<p>Your Code:</p>

<input id="refcode" readonly>

</div>

<div class="card">

<h3>Coin Store</h3>

<button onclick="buyBoost(2,0.05)">Buy x2 Boost (0.05)</button>
<button onclick="buyBoost(3,0.1)">Buy x3 Boost (0.1)</button>

</div>

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet Address">
<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Request Withdrawal</button>

</div>

<div class="card">

<h3>Leaderboard</h3>

<div id="leaderboard" class="leaderboard"></div>

</div>

</div>

</div>

<script>

const supabaseUrl="https://kdmknilstonmiesjocvy.supabase.co"
const supabaseKey="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE"

const db=supabase.createClient(supabaseUrl,supabaseKey)

let user=null
let coins=0
let xp=0
let level=1
let streak=0
let multiplier=1

async function signup(){

const {error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error) return alert(error.message)

alert("Account created")

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error) return alert(error.message)

user=data.user

startApp()

}

async function startApp(){

auth.style.display="none"
app.style.display="block"

avatar.innerText=user.email[0].toUpperCase()
username.innerText=user.email.split("@")[0]

loadUser()
leaderboardLoad()

}

async function loadUser(){

let {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

if(!data){

let code=Math.random().toString(36).substring(2,8)

await db.from("users").insert({
id:user.id,
coins:0,
xp:0,
level:1,
streak:0,
refcode:code
})

coins=0
xp=0
level=1
streak=0

refcode.value=code

}else{

coins=data.coins
xp=data.xp
level=data.level
streak=data.streak

refcode.value=data.refcode

}

updateUI()

}

function updateUI(){

coinsEl=document.getElementById("coins")
coinsEl.innerText=coins.toFixed(3)

level.innerText=level

let percent=(xp%100)

xpbar.style.width=percent+"%"

document.getElementById("streak").innerText=streak

}

async function mine(){

coins+=0.001*multiplier
xp+=5

if(xp>=level*100){

level++

alert("Level Up!")

}

updateUI()

await db
.from("users")
.update({coins,xp,level})
.eq("id",user.id)

}

async function daily(){

coins+=0.01
streak++

updateUI()

await db
.from("users")
.update({coins,streak})
.eq("id",user.id)

}

async function buyBoost(m,cost){

if(coins<cost) return alert("Not enough coins")

coins-=cost
multiplier=m

updateUI()

await db
.from("users")
.update({coins})
.eq("id",user.id)

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:amount.value,
wallet:wallet.value,
status:"pending"
})

alert("Withdrawal requested")

}

async function leaderboardLoad(){

const {data}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

leaderboard.innerHTML=""

data.forEach((u,i)=>{

let div=document.createElement("div")

div.innerHTML=`
<span>#${i+1}</span>
<span>${u.coins.toFixed(2)}</span>
`

leaderboard.appendChild(div)

})

}

async function logout(){

await db.auth.signOut()

location.reload()

}

function toggleTheme(){

document.body.classList.toggle("light")

}

</script>

</body>
</html>
