<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#0b0f1a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
padding:20px;
}

.card{
background:#111827;
padding:25px;
border-radius:15px;
width:420px;
box-shadow:0 0 25px rgba(0,255,255,.2);
}

button{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:8px;
background:#22d3ee;
font-weight:bold;
cursor:pointer;
}

.secondary{
background:#1f2937;
color:white;
}

input{
width:100%;
padding:10px;
margin:6px 0;
border-radius:8px;
border:none;
}

.hidden{
display:none;
}

#progressContainer{
height:20px;
background:#1f2937;
border-radius:10px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:#00e5ff;
}

</style>
</head>

<body>

<div class="card">

<div id="auth">

<h2>VEXA Mining</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="referral" placeholder="Referral Code (optional)">

<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<div id="app" class="hidden">

<h2>Dashboard</h2>

<p>Balance: <b id="balance">0</b> VEXA</p>

<p>Rate: <b id="rate">0.001</b> / min</p>

<p>Your Referral Code:</p>
<b id="refCode"></b>

<button onclick="startMining()">Start Mining</button>
<button onclick="stopMining()" class="secondary">Stop Mining</button>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<h3>Upgrades</h3>

<button onclick="upgrade('auto',10)">Auto Power +1 (10)</button>
<button onclick="upgrade('multi',25)">Multiplier x2 (25)</button>

<h3>Daily Bonus</h3>

<button onclick="daily()">Claim 0.01</button>

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet address">
<input id="amount" placeholder="Amount">

<button onclick="withdraw()">Request Withdraw</button>

<h3>Leaderboard</h3>

<div id="leaderboard"></div>

<button onclick="logout()" class="secondary">Logout</button>

</div>

</div>

<script>

const url="https://kdmknilstonmiesjocvy.supabase.co"
const key="YOUR_PUBLIC_KEY"

const db=supabase.createClient(url,key)

let user
let coins=0
let auto=1
let multi=1
let mining=null

function randomCode(){
return Math.random().toString(36).substring(2,8)
}

async function signup(){

const {data,error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error){msg.innerText=error.message;return}

const code=randomCode()

await db.from("users").insert({
id:data.user.id,
referral_code:code,
referred_by:referral.value||null
})

msg.innerText="Account created"

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error){msg.innerText=error.message;return}

user=data.user

auth.classList.add("hidden")
app.classList.remove("hidden")

loadUser()

}

async function loadUser(){

const {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

coins=data.coins
auto=data.auto_power
multi=data.multiplier

refCode.innerText=data.referral_code

updateUI()

leaderboardLoad()

}

function updateUI(){

balance.innerText=Number(coins).toFixed(6)

rate.innerText=(0.001*auto*multi).toFixed(6)

}

function startMining(){

if(mining)return

mining=setInterval(async()=>{

let amount=0.001*auto*multi

coins+=amount

await db
.from("users")
.update({coins:coins})
.eq("id",user.id)

updateUI()

},60000)

}

function stopMining(){

clearInterval(mining)
mining=null

}

async function upgrade(type,cost){

if(coins<cost)return alert("Not enough")

coins-=cost

if(type==="auto")auto++
if(type==="multi")multi*=2

await db.from("users").update({
coins:coins,
auto_power:auto,
multiplier:multi
}).eq("id",user.id)

updateUI()

}

async function daily(){

coins+=0.01

await db.from("users").update({coins:coins}).eq("id",user.id)

updateUI()

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:amount.value,
wallet:wallet.value
})

alert("Withdraw request sent")

}

async function leaderboardLoad(){

const {data}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(5)

leaderboard.innerHTML=""

data.forEach(u=>{
leaderboard.innerHTML+=`<p>${Number(u.coins).toFixed(3)} VEXA</p>`
})

}

async function logout(){

await db.auth.signOut()
location.reload()

}

</script>

</body>
</html>
