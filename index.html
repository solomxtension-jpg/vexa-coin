<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>

<style>
body{
  background:#0b0f1a;
  color:#ffffff;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:16px;
  width:360px;
  box-shadow:0 0 25px rgba(0,229,255,.25);
  text-align:center;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}
button.secondary{
  background:#1c2747;
  color:#fff;
}
#progressBox{
  width:100%;
  height:16px;
  background:#1c2747;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}
#progress{
  height:100%;
  width:0%;
  background:#00e5ff;
}
.coin{
  position:absolute;
  font-size:20px;
  animation:float 1s forwards;
}
@keyframes float{
  from{opacity:1; transform:translateY(0);}
  to{opacity:0; transform:translateY(-40px);}
}
</style>
</head>

<body>

<div class="card">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>VEXA Mining PRO</h2>
    <button onclick="login()">Login (Demo)</button>
  </div>

  <!-- APP -->
  <div id="appBox" style="display:none;">
    <h3 id="balance">Balance: 0 VEXA</h3>
    <h4 id="level">Level: 1</h4>
    <h4 id="rate">Rate: 1 VEXA / 5s</h4>
    <h4 id="today">Mined today: 0</h4>

    <button onclick="startMining()">Start Mining</button>
    <button onclick="stopMining()" class="secondary">Stop Mining</button>
    <button onclick="upgrade()">Upgrade Miner (10 VEXA)</button>

    <div id="progressBox">
      <div id="progress"></div>
    </div>

    <button onclick="logout()" class="secondary">Logout</button>
  </div>

</div>

<script>
/* ===== GAME STATE ===== */
let balance = 0;
let level = 1;
let minedToday = 0;
let miningTimer = null;
let progressTimer = null;

/* ===== ELEMENTS ===== */
const balanceEl = document.getElementById("balance");
const levelEl = document.getElementById("level");
const rateEl = document.getElementById("rate");
const todayEl = document.getElementById("today");
const progressEl = document.getElementById("progress");

/* ===== UI UPDATE ===== */
function updateUI(){
  balanceEl.innerText = "Balance: " + balance + " VEXA";
  levelEl.innerText = "Level: " + level;
  rateEl.innerText = "Rate: " + level + " VEXA / 5s";
  todayEl.innerText = "Mined today: " + minedToday;
}

/* ===== LOGIN ===== */
function login(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("appBox").style.display = "block";
  updateUI();
}

/* ===== LOGOUT ===== */
function logout(){
  location.reload();
}

/* ===== START MINING ===== */
function startMining(){
  if(miningTimer) return;

  let progress = 0;
  progressTimer = setInterval(()=>{
    progress += 2;
    if(progress >= 100) progress = 0;
    progressEl.style.width = progress + "%";
  },100);

  miningTimer = setInterval(()=>{
    balance += level;
    minedToday += level;
    updateUI();
    spawnCoin();
  },5000);
}

/* ===== STOP MINING ===== */
function stopMining(){
  clearInterval(miningTimer);
  clearInterval(progressTimer);
  miningTimer = null;
  progressTimer = null;
  progressEl.style.width = "0%";
}

/* ===== UPGRADE ===== */
function upgrade(){
  if(balance < 10){
    alert("You need 10 VEXA to upgrade");
    return;
  }
  balance -= 10;
  level += 1;
  updateUI();
}

/* ===== FLOATING COIN ===== */
function spawnCoin(){
  const coin = document.createElement("div");
  coin.className = "coin";
  coin.innerText = "🪙";
  const box = document.querySelector(".card").getBoundingClientRect();
  coin.style.left = box.left + box.width/2 + "px";
  coin.style.top = box.top + box.height/2 + "px";
  document.body.appendChild(coin);
  setTimeout(()=>coin.remove(),1000);
}
</script>

</body>
</html>
