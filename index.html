<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEXA Mining PRO</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    body{
      background:#0b0f1a;
      color:#ffffff;
      font-family: Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .card{
      background:#11182b;
      padding:25px;
      border-radius:16px;
      width:340px;
      box-shadow:0 0 25px rgba(0,229,255,.2);
      text-align:center;
    }
    input{
      width:90%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:none;
    }
    button{
      width:95%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      background:#00e5ff;
      color:#000;
      font-weight:bold;
      cursor:pointer;
    }
    button.secondary{
      background:#1c2747;
      color:#fff;
    }
    hr{margin:15px 0; border-color:#00e5ff33;}
  </style>
</head>
