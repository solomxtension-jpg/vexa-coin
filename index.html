<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VEXA Mining</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 10px;
      margin: 5px;
      width: 90%;
      max-width: 300px;
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      cursor: pointer;
    }
    .card {
      background: #111827;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h1>⛏️ VEXA Mining</h1>

  <!-- AUTH -->
  <div id="auth" class="card">
    <h2>Login / Signup</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="signUp()">Sign Up</button>
    <button onclick="login()">Login</button>
    <p id="authMsg"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="card hidden">
    <h2>Dashboard</h2>
    <p><strong>Balance:</strong> <span id="balance">0</span> VEXA</p>
    <p><strong>Mined Today:</strong> <span id="today">0</span></p>
    <p><strong>Mining Rate:</strong> <span id="rate">1</span>/click</p>

    <button onclick="mine()">⛏️ Start Mining</button>
    <button onclick="upgrade()">⚡ Upgrade Miner</button>
    <button onclick="logout()">Logout</button>

    <p id="msg"></p>
  </div>

<script>
/* =========================
   SUPABASE CONFIG
========================= */
const supabaseUrl = "https://qmcjmnugpujsqabqejpx.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY2ptbnVncHVqc3FhYnFlanB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NDEyNDQsImV4cCI6MjA4NzExNzI0NH0.U0Sl5wmt6CHrwOgoV5bSJYG1PuHjumDr23v65tAnLqo";

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

/* =========================
   AUTH FUNCTIONS
========================= */
async function signUp() {
  const email = email.value;
  const password = password.value;

  const { error } = await supabase.auth.signUp({ email, password });
  authMsg.innerText = error ? error.message : "Signup successful. Login now.";
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    authMsg.innerText = error.message;
    return;
  }

  authMsg.innerText = "";
  document.getElementById("auth").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadUser();
}

async function logout() {
  await supabase.auth.signOut();
  location.reload();
}

/* =========================
   LOAD USER DATA
========================= */
async function loadUser() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return;

  const { data, error } = await supabase
    .from("users")
    .select("*")
    .eq("id", user.id)
    .single();

  if (error) {
    msg.innerText = error.message;
    return;
  }

  balance.innerText = data.balance;
  today.innerText = data.coins_today;
  rate.innerText = data.mining_rate;
}

/* =========================
   MINING
========================= */
async function mine() {
  const { error } = await supabase.rpc("mine_coin");
  if (error) {
    msg.innerText = error.message;
    return;
  }
  loadUser();
}

/* =========================
   UPGRADE
========================= */
async function upgrade() {
  const { error } = await supabase.rpc("upgrade_miner");
  if (error) {
    msg.innerText = error.message;
    return;
  }
  loadUser();
}

/* =========================
   AUTO LOGIN CHECK
========================= */
(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadUser();
  }
})();
</script>

</body>
</html>
