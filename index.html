<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:linear-gradient(135deg,#0b0f1a,#1c1f2a);
color:white;
font-family:Arial;
display:flex;
justify-content:center;
padding:20px;
}

.card{
background:#111827;
padding:25px;
border-radius:16px;
width:420px;
box-shadow:0 0 25px rgba(0,255,255,.2);
}

h2{color:#22d3ee;text-align:center}

input,button{
width:100%;
padding:10px;
margin:6px 0;
border:none;
border-radius:8px;
font-size:14px;
}

button{
background:#22d3ee;
font-weight:bold;
cursor:pointer;
}

.secondary{
background:#1f2937;
color:white;
}

.hidden{display:none}

.stat{margin:8px 0}

#leaderboard p{
margin:3px 0;
font-size:13px;
}

</style>

</head>

<body>

<div class="card">

<div id="auth">

<h2>VEXA Mining</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="refInput" placeholder="Referral Code (optional)">

<button onclick="signup()">Sign Up</button> <button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<div id="app" class="hidden">

<h2>Dashboard</h2>

<div class="stat">Balance: <b id="balance">0</b> VEXA</div>

<div class="stat">Mining Rate: <b id="rate">1</b> / min</div>

<div class="stat">Your Referral Code:</div>
<b id="refCode"></b>

<button onclick="startMining()">⛏ Start 24h Mining</button>

<h3>Upgrades</h3>

<button onclick="upgrade('auto',10)">Auto Power +1 (10)</button> <button onclick="upgrade('multi',25)">Multiplier x2 (25)</button>

<h3>Daily Bonus</h3>

<button onclick="daily()">Claim 0.01</button>

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet Address">
<input id="amount" placeholder="Amount">
<button onclick="withdraw()">Request Withdrawal</button>

<h3>Leaderboard</h3>

<div id="leaderboard"></div>

<button onclick="logout()" class="secondary">Logout</button>

</div>

</div>

<script>

const SUPABASE_URL="https://kdmknilstonmiesjocvy.supabase.co"
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbWtuaWxzdG9ubWllc2pvY3Z5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI1NzcyNTEsImV4cCI6MjA4ODE1MzI1MX0.ei6PvC3unpAjp-78mTTJxC1d72o3Ap_k6fuvuARbYUE"

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let user
let coins=0
let auto=1
let multi=1
let lastMine=null

function randomCode(){
return Math.random().toString(36).substring(2,8)
}

async function signup(){

const {data,error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error){msg.innerText=error.message;return}

let ref=refInput.value||null

await db.from("users").insert({
id:data.user.id,
referral_code:randomCode(),
referred_by:ref
})

msg.innerText="Account created successfully"

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error){msg.innerText=error.message;return}

user=data.user

auth.classList.add("hidden")
app.classList.remove("hidden")

loadUser()

}

async function loadUser(){

const {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

coins=data.coins || 0
auto=data.auto_power || 1
multi=data.multiplier || 1
lastMine=data.last_mine

refCode.innerText=data.referral_code

calculateOfflineMining()

updateUI()

leaderboard()

}

function calculateOfflineMining(){

if(!lastMine)return

let last=new Date(lastMine)
let now=new Date()

let minutes=(now-last)/60000

let rate=0.001*auto*multi

let earned=minutes*rate

coins+=earned

saveCoins()

}

async function saveCoins(){

await db
.from("users")
.update({
coins:coins,
last_mine:new Date()
})
.eq("id",user.id)

updateUI()

}

function updateUI(){

balance.innerText=Number(coins).toFixed(6)

rate.innerText=(0.001*auto*multi).toFixed(6)

}

async function startMining(){

if(!user){
alert("Login first")
return
}

await db

alert()

}

async function upgrade(type,cost){

if(coins<cost){alert("Not enough coins");return}

coins-=cost

if(type==="auto")auto++
if(type==="multi")multi*=2

await db.from("users").update({
coins:coins,
auto_power:auto,
multiplier:multi
}).eq("id",user.id)

updateUI()

}

async function daily(){

const {data}=await db
.from("users")
.select("last_daily")
.eq("id",user.id)
.single()

let last=data.last_daily

if(last && Date.now()-new Date(last)<86400000){

alert("already claimed")

return
}

coins+=0.01

await db.from("users").update({
coins:coins,
last_daily:new Date()
}).eq("id",user.id)

updateUI()

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:amount.value,
wallet:wallet.value
})

alert("Withdraw request sent")

}

async function leaderboard(){

const {data,error}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

if(error){
console.log(error)
return
}

if(!data){
leaderboard.innerHTML="No miners yet"
return
}

data.forEach(u=>{
leaderboard.innerHTML+=`<p>${Number(u.coins||0).toFixed(3)} VEXA</p>`
})

}

async function logout(){

await db.auth.signOut()

location.reload()

(async()=>{

const {data:{session}}=await db.auth.getSession()

if(session){

user=session.user

auth.classList.add("hidden")
app.classList.remove("hidden")

loadUser()

}

})()

</script>

</body>
</html>
