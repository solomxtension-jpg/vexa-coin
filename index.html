<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VEXA Mining PRO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  background:#0b0f1a;
  color:white;
  font-family:Arial;
  text-align:center;
  padding-top:40px;
}
.card{
  background:#11182b;
  padding:25px;
  border-radius:15px;
  width:350px;
  margin:auto;
  box-shadow:0 0 20px #00f0ff33;
}
input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:85%;
  margin-bottom:10px;
}
button{
  background:#00e5ff;
  color:black;
  border:none;
  padding:10px 18px;
  border-radius:10px;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h2>VEXA Mining PRO</h2>

<div id="authSection">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signUp()">Sign Up</button>
<button onclick="login()">Login</button>
</div>

<div id="appSection" style="display:none;">
<h3 id="balance">Balance: 0 VEXA</h3>
<h4 id="level">Level: 1</h4>

<button onclick="startMining()">Start Mining</button>
<button onclick="upgrade()">Upgrade Miner</button>

<hr>

<input id="withdrawAmount" placeholder="Amount to withdraw">
<input id="walletAddress" placeholder="Wallet address">
<button onclick="withdraw()">Request Withdrawal</button>

<br><br>
<button onclick="logout()">Logout</button>
</div>

</div>

<script>

const supabaseClient = window.supabase.createClient(
  'https://qmcjmnugpujsqabqejpx.supabase.co',
  'sb_publishable_iJ0Xgceyxde4ZnAXeRHcqQ_wNzyi4iq'
);

let currentUser = null;
let miningInterval;

async function signUp(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabaseClient.auth.signUp({ email, password });

  if(error){ alert(error.message); return; }
  alert("Check email to confirm.");
}

async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if(error){ alert(error.message); return; }

  currentUser = data.user;

  document.getElementById("authSection").style.display="none";
  document.getElementById("appSection").style.display="block";

  loadUser();
}

async function loadUser(){

  let { data } = await supabaseClient
    .from('users')
    .select('*')
    .eq('username', currentUser.id)
    .single();

  if(!data){
    await supabaseClient.from('users').insert({
      username: currentUser.id,
      balance: 0,
      level: 1
    });

    document.getElementById("balance").innerText = "Balance: 0 VEXA";
    document.getElementById("level").innerText = "Level: 1";
  }else{
    document.getElementById("balance").innerText =
      "Balance: " + data.balance + " VEXA";

    document.getElementById("level").innerText =
      "Level: " + data.level;
  }
}

async function startMining(){
  if(miningInterval) return;

  miningInterval = setInterval(async () => {
    await supabaseClient.rpc('mine_coin', { uid: currentUser.id });
    loadUser();
  }, 5000);
}

async function upgrade(){
  await supabaseClient.rpc('upgrade_miner', { uid: currentUser.id });
  loadUser();
}

async function withdraw(){

  const amount = parseInt(document.getElementById("withdrawAmount").value);
  const wallet = document.getElementById("walletAddress").value;

  if(!amount || !wallet){
    alert("Enter amount and wallet");
    return;
  }

  await supabaseClient.rpc('request_withdraw', {
    uid: currentUser.id,
    amt: amount,
    wallet_addr: wallet
  });

  alert("Withdrawal request submitted.");
  loadUser();
}

async function logout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

</script>

</body>
</html>
