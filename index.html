<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEXA Mining PRO</title>

  <link rel="manifest" href="manifest.json">

  <style>
    body{
      background:#0b0f1a;
      color:#ffffff;
      font-family: Arial, sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }
    .card{
      background:#11182b;
      padding:25px;
      border-radius:16px;
      width:340px;
      box-shadow:0 0 25px rgba(0,229,255,.2);
      text-align:center;
    }
    input{
      width:90%;
      padding:12px;
      margin:8px 0;
      border-radius:8px;
      border:none;
    }
    button{
      width:95%;
      padding:12px;
      margin-top:10px;
      border-radius:10px;
      border:none;
      background:#00e5ff;
      color:#000;
      font-weight:bold;
      cursor:pointer;
    }
    button.secondary{
      background:#1c2747;
      color:#fff;
    }
  </style>
</head>

<body>

<div class="card">
  <h2>VEXA Mining PRO</h2>

  <!-- AUTH -->
  <div id="authBox">
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn" class="secondary">Login</button>
  </div>

  <!-- APP -->
  <div id="appBox" style="display:none">
    <h3>Logged in ✅</h3>
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const supabase = createClient(
    "https://qmcjmnugpujsqabqejpx.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtY2ptbnVncHVqc3FhYnFlanB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1NDEyNDQsImV4cCI6MjA4NzExNzI0NH0.U0Sl5wmt6CHrwOgoV5bSJYG1PuHjumDr23v65tAnLqo"
  );

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  document.getElementById("signupBtn").addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if(!email || !password){
      alert("Enter email and password");
      return;
    }

    const { error } = await supabase.auth.signUp({ email, password });

    if(error){
      alert(error.message);
      return;
    }

    alert("Signup successful. Now login.");
  });

  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    const { error } =
      await supabase.auth.signInWithPassword({ email, password });

    if(error){
      alert(error.message);
      return;
    }

    document.getElementById("authBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    location.reload();
  });
</script>

</body>
</html>
