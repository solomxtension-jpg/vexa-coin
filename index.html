<!DOCTYPE html>

<html>
<head>

<meta charset="UTF-8">
<title>VEXA Mining</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#0f172a,#020617);
color:white;
}

.wrapper{
max-width:1100px;
margin:auto;
padding:20px;
}

.auth{
max-width:400px;
margin:120px auto;
background:#111827;
padding:30px;
border-radius:15px;
box-shadow:0 0 30px rgba(0,255,255,.15);
}

h1{
text-align:center;
color:#22d3ee;
}

input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:8px;
background:#1f2937;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:8px;
background:#22d3ee;
font-weight:bold;
cursor:pointer;
}

.dashboard{
display:none;
}

.header{
display:flex;
justify-content:space-between;
margin-bottom:20px;
}

.balanceCard{
background:#111827;
padding:20px;
border-radius:12px;
font-size:22px;
box-shadow:0 0 20px rgba(0,255,255,.15);
}

.mineBtn{
width:100%;
padding:18px;
font-size:18px;
border:none;
border-radius:12px;
background:#22d3ee;
cursor:pointer;
box-shadow:0 0 20px #22d3ee;
margin-bottom:20px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
}

.card h3{
margin-top:0;
}

#leaderboard p{
margin:4px 0;
font-size:14px;
}

.logout{
margin-top:20px;
background:#ef4444;
}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="auth" class="auth">

<h1>VEXA Mining</h1>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="refInput" placeholder="Referral Code (optional)">

<button onclick="signup()">Create Account</button> <button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="wrapper dashboard">

<div class="header">

<div class="balanceCard">
Balance: <b id="balance">0</b> VEXA
</div>

<div class="balanceCard">
Rate: <b id="rate">0</b>
</div>

</div>

<button class="mineBtn" onclick="startMining()">⛏ Start Mining</button>

<div class="grid">

<div class="card">

<h3>Upgrades</h3>

<button onclick="upgradeAuto()">Auto Power +1 (10)</button> <button onclick="upgradeMulti()">Multiplier x2 (25)</button>

</div>

<div class="card">

<h3>Daily Bonus</h3>

<button onclick="daily()">Claim 0.01</button>

</div>

<div class="card">

<h3>Withdraw</h3>

<input id="wallet" placeholder="Wallet">
<input id="amount" placeholder="Amount">
<button onclick="withdraw()">Request Withdrawal</button>

</div>

<div class="card">

<h3>Leaderboard</h3>
<div id="leaderboard"></div>

</div>

</div>

<button class="logout" onclick="logout()">Logout</button>

</div>

<script>

const SUPABASE_URL="YOUR_SUPABASE_URL"
const SUPABASE_KEY="YOUR_SUPABASE_KEY"

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let user=null
let coins=0
let auto=1
let multi=1
let mining=false

function randomCode(){
return Math.random().toString(36).substring(2,8)
}

async function signup(){

const {data,error}=await db.auth.signUp({
email:email.value,
password:password.value
})

if(error){
msg.innerText=error.message
return
}

await db.from("users").insert({
id:data.user.id,
coins:0,
auto_power:1,
multiplier:1,
referral_code:randomCode(),
referred_by:refInput.value||null
})

msg.innerText="Account created"

}

async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:email.value,
password:password.value
})

if(error){
msg.innerText=error.message
return
}

user=data.user

auth.style.display="none"
dashboard.style.display="block"

loadUser()

}

async function loadUser(){

const {data}=await db
.from("users")
.select("*")
.eq("id",user.id)
.single()

coins=data.coins||0
auto=data.auto_power||1
multi=data.multiplier||1

updateUI()
leaderboard()

}

function updateUI(){

balance.innerText=coins.toFixed(6)
rate.innerText=(0.001*auto*multi).toFixed(6)

}

function startMining(){

if(mining) return

mining=true

setInterval(async()=>{

let reward=0.001*auto*multi

coins+=reward

await db.from("users")
.update({coins:coins})
.eq("id",user.id)

updateUI()

},60000)

}

async function upgradeAuto(){

if(coins<10){
alert("Need 10 coins")
return
}

coins-=10
auto++

await db.from("users")
.update({coins:coins,auto_power:auto})
.eq("id",user.id)

updateUI()

}

async function upgradeMulti(){

if(coins<25){
alert("Need 25 coins")
return
}

coins-=25
multi*=2

await db.from("users")
.update({coins:coins,multiplier:multi})
.eq("id",user.id)

updateUI()

}

async function daily(){

coins+=0.01

await db.from("users")
.update({coins:coins})
.eq("id",user.id)

updateUI()

}

async function withdraw(){

await db.from("withdrawals").insert({
user_id:user.id,
amount:amount.value,
wallet:wallet.value
})

alert("Withdrawal request sent")

}

async function leaderboard(){

const {data}=await db
.from("users")
.select("coins")
.order("coins",{ascending:false})
.limit(10)

leaderboard.innerHTML=""

if(!data) return

data.forEach(u=>{
leaderboard.innerHTML+=
`<p>${Number(u.coins||0).toFixed(3)} VEXA</p>`
})

}

async function logout(){

await db.auth.signOut()

location.reload()

}

</script>

</body>
</html>
